<script>
(function () {
  var C = {"labId": "storia_doppio_tavolo", "titolo": "Il doppio tavolo", "sottotitolo": "Marzo-aprile 1915: la trattativa di Sonnino con Vienna e con l'Intesa", "descrizione": "Laboratorio a casa: da ministro degli Esteri, tra marzo e aprile 1915 tratti con Vienna e con l'Intesa, poi confronti le tue richieste con il Patto di Londra.", "intestazione": [["Disciplina e anno", "Storia, V anno"], ["Collocazione", "Prima guerra mondiale, tappa 5: l'ingresso dell'Italia in guerra. Da svolgere dopo il laboratorio «La piazza e il palazzo»; in classe, discussione libera di 5-10 minuti"], ["Tipo e uso", "Laboratorio digitale individuale · esercitazione (le risposte finali arrivano al docente)"], ["Durata", "20-25 minuti, a casa"], ["Tipologia", "Contestualizzare e collegare"], ["Famiglie e indicatori", "C. Collocare nel tempo e nello spazio: riconoscere i legami di causa ed effetto tra gli eventi. A. Analizzare testi e fonti: analizzare una fonte, stabilirne tipo, data, provenienza, autore e destinatario. Le due famiglie sono sullo stesso piano"], ["Operazioni", "Riconoscere il legame tra ogni mossa e la risposta delle controparti; analizzare il Patto di Londra (chi firma, che cosa promette, chi deve saperlo)"], ["Livello di guida", "Media"], ["Valutato", "No: formativo"]], "chiSei": "Sei Sidney Sonnino, ministro degli Esteri dal novembre 1914 nel governo Salandra. L'Italia è neutrale. Da dicembre tratti con l'Austria-Ungheria, l'alleata della Triplice, per ottenere territori in cambio della neutralità; da febbraio prepari anche le condizioni per entrare in guerra con l'Intesa. Sono due tavoli, e ciascuno dei due interlocutori sa poco o nulla dell'altro.", "comeFunziona": ["Giocherai quattro turni, dal 4 marzo al 26 aprile 1915. A ogni turno leggi il dossier: che cosa offre Vienna, che cosa fa la Germania, a che punto è l'Intesa.", "Poi scegli la tua mossa e la motivi in una riga. Al primo turno scegli anche che cosa chiedere; al terzo puoi correggere la tua lista.", "Dopo ogni scelta vedi che cosa comporta (tempi, garanzie, rischi) e che cosa fece davvero Sonnino. Le risposte di Vienna, Berlino e Londra sono quelle storiche: le tue scelte cambiano il tuo dossier, non la storia.", "Alla fine confronti le tue richieste con quelle di Sonnino e con il testo del Patto di Londra.", "Le scelte non si correggono a posteriori: come in ogni trattativa, quello che hai detto resta detto."], "tempi": [["Ruolo e richiamo", "2 min"], ["Turno 1 · 4 marzo", "5 min"], ["Turno 2 · 17-27 marzo", "4 min"], ["Turno 3 · 2-9 aprile", "4 min"], ["Turno 4 · 16-21 aprile", "3 min"], ["Il confronto con il Patto", "4 min"], ["La domanda finale", "3 min"]], "richiamo": ["La Triplice Alleanza (1882) è un patto difensivo. Il suo articolo 7 prevede che, se l'Austria-Ungheria si espande nei Balcani, l'Italia abbia diritto a «compensi». Su questo articolo il governo italiano ha aperto la trattativa con Vienna: la guerra austriaca contro la Serbia, sostiene, dà all'Italia diritto a compensi.", "Salandra ha definito la linea del governo «sacro egoismo»: un freddo calcolo geopolitico, che misura ogni alleanza su un solo criterio, il consolidamento dell'Italia come grande potenza.", "La Camera ha aggiornato i lavori il 22 marzo e tornerà a riunirsi solo a maggio: le fasi decisive della trattativa si svolgeranno senza sedute parlamentari."], "territori": [{"id": "trentino", "nome": "Trentino"}, {"id": "brennero", "nome": "Alto Adige fino al Brennero"}, {"id": "gorizia", "nome": "Gorizia e Gradisca"}, {"id": "trieste", "nome": "Trieste all'Italia"}, {"id": "istria", "nome": "Istria"}, {"id": "fiume", "nome": "Fiume"}, {"id": "dalmazia", "nome": "Dalmazia intera"}, {"id": "isole", "nome": "Isole dalmate"}, {"id": "valona", "nome": "Valona"}, {"id": "albania", "nome": "Protettorato sull'Albania"}, {"id": "dodecaneso", "nome": "Dodecaneso"}, {"id": "asia", "nome": "Compensi in Asia Minore"}, {"id": "africa", "nome": "Compensi coloniali in Africa"}], "turni": [{"id": "t1", "data": "4 marzo 1915", "titolo": "Che cosa chiedere, e a chi", "dossier": [["Vienna", "Da dicembre tratti con il ministro degli Esteri austriaco, il barone Burián, sui compensi dell'articolo 7. Il 3 marzo Burián ha ripetuto all'ambasciatore Avarna che la cessione di territori austriaci all'Italia, per ora, «non aveva carattere di attualità»."], ["Berlino", "La Germania, alleata di Vienna, vuole tenere l'Italia neutrale. Il suo inviato a Roma, il principe von Bülow, preme su Vienna perché tratti."], ["Londra", "L'ambasciatore Imperiali ha in mano le condizioni che gli hai mandato il 16 febbraio per un'eventuale entrata in guerra con l'Intesa. Aspetta l'ordine per presentarle al ministro degli Esteri britannico Grey."]], "citazioni": [["«la questione dei compensi in generale, come quella posta dal R. Governo sul terreno della cessione di territori posseduti oggi dalla Monarchia, non aveva carattere di attualità»", "Avarna a Sonnino, Vienna, 3 marzo 1915, in Il libro verde"]], "lista": true, "domanda": "A chi presenti oggi le tue richieste?", "opzioni": [{"label": "Solo a Vienna: resto nel quadro della Triplice", "tipo": "accettare", "conseguenza": "Tempi: la trattativa resta quella di dicembre, con Burián che non si pronuncia sulle cessioni. Garanzie: nessuna, finché Vienna non accetta di discutere i propri territori. Rischi: senza un'alternativa, l'unica leva è la minaccia di una rottura che non hai preparato."}, {"label": "Solo a Londra: rompo con Vienna e tratto con l'Intesa", "tipo": "alzare", "conseguenza": "Tempi: l'Intesa è in difficoltà ai Dardanelli e in Russia, e vorrà l'Italia in guerra presto. Garanzie: un accordo scritto con tre grandi potenze. Rischi: rompere subito con Vienna chiude ogni via a ottenere qualcosa senza combattere, e mette in allarme Berlino."}, {"label": "A entrambi: apro il secondo tavolo senza chiudere il primo", "tipo": "tenere", "conseguenza": "Tempi: due trattative in parallelo, ciascuna usata per pesare l'altra. Garanzie: puoi confrontare le offerte. Rischi: tutto regge solo se resta segreto; se Vienna sapesse di Londra, o Londra di Vienna, ciascuno alzerebbe il prezzo o si ritirerebbe."}], "storia": ["Sonnino tiene aperti entrambi i tavoli. Il 4 marzo Imperiali consegna a Grey le sedici condizioni italiane: tra le altre, il confine al Brennero, Trieste e l'Istria senza Fiume, la Dalmazia fino alla Narenta con le isole, Valona e un protettorato sull'Albania, compensi in caso di spartizione dell'Impero ottomano.", "Lo stesso giorno Sonnino fissa per Vienna i suoi «punti fermi». Il 9 marzo Burián cede: l'Austria-Ungheria accetta di discutere la cessione di territori della Monarchia.", "Il 10 marzo Sonnino pone a Vienna le sue condizioni preliminari, fra cui l'«assoluto segreto dei negoziati» e la consegna immediata dei territori appena concluso l'accordo."], "citazioniStoria": [["«Che nessuna proposta o discussione di compensi può condurre ad un accordo se non prospetta la cessione di territori già posseduti dall'Austria-Ungheria»", "Sonnino ad Avarna, Roma, 4 marzo 1915, in Il libro verde"], ["«Non intendiamo fare nessuna comunicazione al Parlamento e al pubblico intorno all'avviamento dei negoziati.»", "Sonnino ad Avarna, Roma, 10 marzo 1915, in Il libro verde"]], "fonti": "Il libro verde, telegrammi del 3, 4, 9 e 10 marzo 1915; per Londra: C. J. Lowe, «Britain and Italian Intervention, 1914-1915», The Historical Journal, 12, 1969."}, {"id": "t2", "data": "17-27 marzo 1915", "titolo": "Subito o a fine guerra?", "dossier": [["Vienna", "Burián accetta di cedere territori, ma non subito: per lui nessun territorio può passare all'Italia prima della pace. Il 27 marzo fa la sua prima offerta: una parte del Tirolo meridionale con Trento. In cambio chiede neutralità benevola per tutta la guerra, mano libera nei Balcani e che l'Italia si accolli la quota di debito pubblico dei territori ceduti e paghi un indennizzo."], ["Berlino", "Il 17 marzo Bülow ti avverte che la tua condizione della consegna immediata rischia di far fallire tutto. Il 20 marzo la Germania offre la propria garanzia che l'accordo sarà eseguito a guerra finita."], ["Londra", "Grey trasforma le tue condizioni in una bozza di trattato. Ma la Russia si oppone: nessuna costa adriatica all'Italia a sud di Spalato, perché la Serbia deve avere uno sbocco sul mare."]], "citazioni": [["«sarebbe stato impossibile al Governo Imperiale e Reale di ammettere il trapasso di alcun territorio della Monarchia prima della conclusione della pace»", "Burián riferito da Avarna, Vienna, 13 marzo 1915, in Il libro verde"], ["«a meno che, egli diceva, siate già decisi a fare la guerra, ed entro il marzo»", "Bülow riferito da Sonnino, Roma, 17 marzo 1915, in Il libro verde"], ["«il Governo Imperiale Germanico assume di fronte al Governo Reale d'Italia la piena ed intiera garanzia che la convenzione da concludersi tra l'Italia e l'Austria-Ungheria sarà messa in esecuzione fedelmente e lealmente appena che la pace sarà conclusa»", "Bülow riferito da Sonnino, Roma, 20 marzo 1915, in Il libro verde"]], "subito": {"domanda": "Insisti perché i territori passino all'Italia subito, appena firmato l'accordo?", "opzioni": ["Sì, subito: è una condizione irrinunciabile", "No, accetto la consegna a fine guerra con la garanzia tedesca"]}, "domanda": "Che cosa rispondi all'offerta di Vienna del 27 marzo?", "opzioni": [{"label": "Alzo: l'offerta è insufficiente, chiedo di più", "tipo": "alzare", "conseguenza": "Tempi: Vienna dovrà riformulare, e ogni settimana conta. Garanzie: nessuna nuova finché Burián non cede. Rischi: se chiedi troppo a Vienna, rafforzi chi a Roma dice che con l'Austria non si arriva a niente; se chiedi poco, perdi peso a Londra."}, {"label": "Accetto: Trento a fine guerra, con la garanzia tedesca", "tipo": "accettare", "conseguenza": "Tempi: l'accordo si può chiudere presto. Garanzie: la firma dell'imperatore e quella tedesca, ma i territori arrivano solo a pace conclusa. Rischi: lo dice Sonnino stesso il 23 marzo, la garanzia della Germania vale se la Germania vince; e l'Italia resterebbe legata alla neutralità per una guerra di durata indefinita."}, {"label": "Tengo aperti i due tavoli: rispondo a Vienna e intanto premo a Londra", "tipo": "tenere", "conseguenza": "Tempi: guadagni settimane per confrontare le offerte. Garanzie: nessuna delle due trattative è chiusa. Rischi: Vienna e Berlino capiscono che qualcosa si muove (Bülow lo sospetta già), e a Londra la Russia frena sulla Dalmazia."}], "storia": ["Sonnino tiene aperti i due tavoli. Il 31 marzo giudica l'offerta austriaca troppo vaga e insufficiente; la questione della consegna immediata la lascia per il momento da parte, senza rinunciarvi. Nelle stesse settimane, a Londra, quando Grey riscrive la bozza per venire incontro alla Russia sulla Dalmazia, minaccia di interrompere i negoziati."], "citazioniStoria": [["«la prospettiva di una esecuzione immediata avvalorerebbe fortemente presso l'opinione Pubblica la tesi favorevole alla moderazione nelle domande di cessioni, mentre ogni differimento inciterebbe a maggiori esigenze»", "Sonnino ad Avarna, Roma, 22 marzo 1915, in Il libro verde"], ["«le trovo da un lato troppo vaghe ed incerte, dall'altro assolutamente insufficienti»", "Sonnino ad Avarna, Roma, 31 marzo 1915, in Il libro verde"]], "fonti": "Il libro verde, telegrammi del 13, 17, 20, 22, 27 e 31 marzo 1915; per Londra: Lowe, «Britain and Italian Intervention», cit."}, {"id": "t3", "data": "2-9 aprile 1915", "titolo": "Il compromesso", "dossier": [["Vienna", "Il 2 aprile Burián precisa l'offerta: i distretti di Trento, Rovereto, Riva, Tione e Borgo, con il confine sull'Adige fino a Lavis. Il 6 aprile ti chiede di formulare tu le tue richieste."], ["Berlino", "Il 2 aprile l'ambasciatore a Berlino riferisce, da fonte autorevole, che la Germania non rifiuterebbe di trattare la pace con la Russia: se accadesse, Vienna avrebbe meno bisogno della neutralità italiana."], ["Londra", "Il ministro degli Esteri francese Delcassé propone una via d'uscita: meno Dalmazia all'Italia, a favore della Serbia, in cambio del pieno possesso del Dodecaneso. La Russia accetta, ma a una condizione: l'Italia deve entrare in guerra entro la fine di aprile. Il 9 aprile il primo ministro britannico Asquith presenta la bozza finale."]], "citazioni": [["«i distretti (Politische Bezirke) di Trento, Rovereto, Riva, Tione (ad eccezione di Madonna di Campiglio e dei suoi dintorni), nonchè il Distretto di Borgo. Nella vallata dell'Adige il confine rimonterebbe fino a Lavis»", "Promemoria di Burián, Vienna, 2 aprile 1915, in Il libro verde"]], "lista": true, "listaDomanda": "Dopo il compromesso proposto a Londra, correggi se vuoi la tua lista: che cosa chiedi adesso?", "domanda": "Come rispondi ai due tavoli?", "opzioni": [{"label": "Alzo: a Vienna le richieste massime, a Londra nessuna rinuncia", "tipo": "alzare", "conseguenza": "Tempi: a Londra la Russia ha messo una scadenza, la fine di aprile. Garanzie: nessuna nuova. Rischi: se Londra rompe sulla Dalmazia resta solo Vienna, che finora ha offerto il Trentino a fine guerra."}, {"label": "Accetto la bozza di Londra: meno Dalmazia, più Dodecaneso", "tipo": "accettare", "conseguenza": "Tempi: la firma è vicina, e con la firma la scadenza per entrare in guerra. Garanzie: un trattato con tre potenze, ma i territori arriveranno solo con la vittoria. Rischi: rinunci a una parte della Dalmazia; e Vienna, se lo scoprisse, chiuderebbe ogni trattativa."}, {"label": "Tengo aperti i due tavoli: mando le mie richieste a Vienna e intanto rispondo a Londra", "tipo": "tenere", "conseguenza": "Tempi: Vienna risponderà in una settimana, Londra aspetta. Garanzie: puoi confrontare l'ultima offerta austriaca con la bozza di Asquith. Rischi: la scadenza russa corre, e un'indiscrezione su uno dei due tavoli brucerebbe l'altro."}], "storia": ["Sonnino fa entrambe le cose. L'8 aprile manda a Vienna undici articoli: il Trentino con i confini del 1811, fino a Chiusa sull'Isarco; Gorizia e Gradisca con il confine sull'Isonzo; Trieste, con Capodistria e Pirano, Stato autonomo e indipendente; le isole Curzolari; Valona; il disinteresse austriaco per l'Albania; 200 milioni di lire in oro a saldo della quota di debito pubblico e dei beni dello Stato nei territori ceduti; in cambio, neutralità per tutta la guerra. E all'articolo V: l'Italia occupa subito i territori ceduti.", "Il 14 aprile, sei giorni dopo, accetta con modifiche minori la bozza di Asquith."], "citazioniStoria": [["«L'Italia occuperà subito i territori cedutile»", "Sonnino ad Avarna, Roma, 8 aprile 1915, articolo V delle proposte, in Il libro verde"]], "fonti": "Il libro verde, telegrammi del 2, 6 e 8 aprile 1915; per Londra: Lowe, «Britain and Italian Intervention», cit."}, {"id": "t4", "data": "16-21 aprile 1915", "titolo": "Firmare?", "dossier": [["Vienna", "Il 16 aprile arriva la risposta di Burián. Gli articoli su Gorizia e l'Isonzo, su Trieste e sulle isole sono «inaccettabili». Sul Trentino Vienna si allarga: il confine scenderebbe fino a sud di Salorno. Sulla consegna immediata, no: si fa a pace conclusa, come per Nizza e Savoia nel 1860. Sull'Albania, no. Sull'indennizzo, si può andare all'arbitrato dell'Aia."], ["Berlino", "La Germania resta garante di un accordo da eseguire a guerra finita."], ["Londra", "Il testo è pronto e hai già detto sì. Firmandolo, l'Italia si impegna a entrare in guerra entro un mese."]], "citazioni": [["«il Mare Adriatico sarebbe divenuto un mare italiano qualora l'Italia avesse conservato il possesso di Valona»", "Burián riferito da Avarna, Vienna, 16 aprile 1915, in Il libro verde"]], "domanda": "Che cosa fai?", "opzioni": [{"label": "Firmo a Londra", "tipo": "accettare", "conseguenza": "Tempi: entro un mese l'Italia deve essere in guerra. Garanzie: i territori del trattato, a vittoria ottenuta. Rischi: la guerra; e il Parlamento, che non sa nulla, dovrà votare i mezzi per farla."}, {"label": "Accetto l'offerta di Vienna: Trentino fino a Salorno, neutr     c.appendChild(el("p", S.ok === false ? "warn" : "note", S.ok === false ? "Attenzione: le risposte NON sono state registrate (connessione assente o bloccata). Avvisa il docente." : "Risposte registrate: il docente le leggerà per preparare la discussione in classe."));
    c.appendChild(el("h3", null, C.finale.domanda));
    c.appendChild(el("div", "mine", S.fin || "(nessuna risposta)"));
    app.appendChild(c);
    T.forEach(function (t, i) {
      var h = el("div", "card"); h.appendChild(el("div", "eyebrow", "Turno " + (i + 1) + " · " + t.data)); h.appendChild(el("h3", null, t.titolo)); app.appendChild(h);
      if (S.mossa[t.id] != null) esitoCard(app, t, false);
    });
    confrontoCards(app);
    window.scrollTo(0, 0);
  }

  function avvia() {
    app = document.getElementById("app");
    if (!window.Addestramento) { render(); return; }
    window.Addestramento.start({
      labId: LAB_ID, title: C.titolo,
      salvaRisposte: true,        // decisione del docente
      tempoAtteso: 1200,          // 20 minuti
      caratteriAttesi: 600,       // quattro motivazioni e la domanda finale
      onReady: function () { app = document.getElementById("app"); render(); }
    });
  }
  avvia();
})();
</script>
</body>
</html>
