<script>
(function () {
  "use strict";
  var D = {"labId":"storia_riorganizzazione_produzione_fonti","titolo":"Riorganizzare la produzione: tre fonti e uno schema","tipologiaEtichetta":"Analizzare testi","richiamo":{"titolo":"Prima di cominciare","testo":["Hai appena visto come, dopo il 1873, le economie industriali entrano in una lunga crisi e cambiano il modo di produrre. Oggi guardi tre fonti di quegli anni: una tabella, un brano di un ingegnere americano e una legge degli Stati Uniti. Alla fine le colleghi alla slide della lezione.","Lavori da solo. Hai circa 40 minuti: 6 per la tabella, 11 per il brano, 10 per la legge, 9 per la slide. Alla fine consegni e vedi la correzione."]},"parti":[{"titolo":"Parte 1 — Prezzi e produzione","meta":"Guida media · 6 minuti","contesto":["La tabella mette a confronto, per la Gran Bretagna, due misure in cinque anni: i prezzi all’ingrosso e la produzione industriale. Ciascuna è un indice con una base diversa, quindi non confrontare i numeri delle due colonne tra loro: guarda in che direzione va ciascuna, e di quanto."],"fonte":{"tipo":"tabella","intestazione":["Anno","Prezzi all’ingrosso (1867-77 = 100)","Produzione industriale (1913 = 100)"],"righe":[["1873","111","49"],["1880","88","54"],["1886","69","55"],["1890","72","66"],["1896","61","71"]],"didascalia":"Gran Bretagna. Prezzi: indice Sauerbeck dei prezzi all’ingrosso; produzione: indice del volume della produzione industriale. Valori arrotondati, da NBER Macrohistory Database."},"domande":[{"tipo":"mc","id":"p1_q1","prompt":"Fra il 1873 e il 1896, che cosa fanno i prezzi?","opts":["Salgono di poco, perché le merci prodotte diventano sempre di più","Scendono di quasi la metà, da 111 a 61, e restano bassi","Restano più o meno uguali, con piccole oscillazioni da un anno all’altro","Crollano nel 1873 e poi risalgono fino a tornare ai valori di partenza"],"ok":1,"why":"Da 111 a 61 l’indice perde 50 punti: circa il 45% in meno, cioè quasi la metà. Per più di vent’anni le stesse merci costano sempre meno.","etichetta":"1"},{"tipo":"mc","id":"p1_q2","prompt":"E nello stesso periodo, che cosa fa la produzione industriale?","opts":["Scende anche lei, perché le fabbriche chiudono una dopo l’altra","Resta ferma: la crisi blocca ogni crescita per più di vent’anni","Sale di quasi la metà, da 49 a 71, nonostante la crisi","Sale fino al 1880 e poi scende fino al 1896, come i prezzi"],"ok":2,"why":"Da 49 a 71 la produzione cresce di circa il 45%. È il punto strano di questa «depressione»: le fabbriche producono di più, ma vendono a prezzi sempre più bassi.","etichetta":"2"},{"tipo":"mc","id":"p1_q3","prompt":"La discesa dei prezzi è continua, anno dopo anno?","opts":["No: tra il 1886 e il 1890 risalgono un poco, poi riprendono a scendere","Sì: i prezzi scendono sempre, senza mai fermarsi, dal 1873 fino al 1896","No: tra il 1880 e il 1886 risalgono molto, e poi crollano tutti insieme","Non si può dire nulla, perché gli anni della tabella sono troppo pochi"],"ok":0,"why":"Tra il 1886 (69) e il 1890 (72) i prezzi risalgono di poco, poi tornano a scendere fino a 61. La tendenza lunga è al ribasso, ma non è una linea dritta. Attenzione anche all’ultima risposta: è vero che cinque anni sono pochi, e che con altri anni scelti la tabella mostrerebbe altre oscillazioni. Ma qualcosa si può dire: la direzione.","etichetta":"3"}],"approfondimento":{"titolo":"Che cosa c’è intorno alla tabella","testo":["Fra il 1873 e il 1896 l’Europa e gli Stati Uniti attraversano quella che i contemporanei chiamarono «Grande depressione»: un nome poi passato al crollo del 1929, che fu una crisi molto diversa. Qui la produzione non crolla: a scendere, per più di vent’anni, sono i prezzi.","In che senso è una depressione, allora, e per chi? Prezzi bassi sono una buona notizia per chi compra: per un operaio con un salario, il pane costa meno. Sono una cattiva notizia per chi vende: gli agricoltori, colpiti dal grano americano a basso prezzo, e le imprese, che guadagnano meno su ogni merce. È da qui che parte la riorganizzazione della slide."]}},{"titolo":"Parte 2 — Taylor e il lavoro pianificato","meta":"Guida media · 11 minuti","contesto":["Frederick W. Taylor (1856-1915) è un ingegnere americano che ha lavorato a lungo nelle acciaierie. Nel 1911 pubblica The Principles of Scientific Management, cioè I principi dell’organizzazione scientifica del lavoro."],"fonte":{"tipo":"testo","paragrafi":["«In passato l’uomo veniva prima; in futuro dovrà venire prima il sistema. […]","I dirigenti si assumono nuovi compiti, nuovi doveri e responsabilità mai immaginati in passato. […] Primo: sviluppano una scienza per ogni elemento del lavoro di un uomo, che prende il posto del vecchio metodo empirico. Secondo: selezionano scientificamente l’operaio, e poi lo addestrano, lo istruiscono e lo formano, mentre in passato era lui a scegliersi il lavoro e ad addestrarsi come meglio poteva. […]","Forse l’elemento più importante dell’organizzazione scientifica moderna è l’idea del compito. Il lavoro di ogni operaio è interamente pianificato dalla direzione almeno un giorno prima, e ciascuno riceve, nella maggior parte dei casi, istruzioni scritte complete, che descrivono nei particolari il compito da svolgere e i mezzi da usare per svolgerlo.»"],"didascalia":"F. W. Taylor, The Principles of Scientific Management, 1911: tre passi dall’introduzione e dal capitolo 2. Traduzione di lavoro per uso didattico; i tagli sono segnalati con […]."},"classOpzioni":["Descrive come funziona","Dice come si deve fare"],"domande":[{"tipo":"mc","id":"p2_q1","primaDellaFonte":true,"prompt":"Prima di leggere il brano, guarda il paratesto: un ingegnere, il 1911, un titolo come «I principi dell’organizzazione scientifica del lavoro». Che cosa promette il libro?","opts":["Un’inchiesta sulle condizioni di vita degli operai nelle grandi fabbriche americane","Un manuale di diritto del lavoro, con tutte le regole sui contratti e sugli orari","Una storia delle fabbriche americane, dalle loro origini fino ai primi del Novecento","Un metodo per organizzare il lavoro, presentato come una scienza da applicare"],"ok":3,"why":"«Principi» e «scientifica» dicono che l’autore non vuole raccontare o denunciare: vuole proporre regole generali, da applicare ovunque, con l’autorità della scienza. Chi scrive è un ingegnere, e il lettore a cui pensa è chi dirige una fabbrica.","etichetta":"1"},{"tipo":"class","id":"p2_c1","frase":"«In passato l’uomo veniva prima; in futuro dovrà venire prima il sistema.»","ok":1,"why":"«Dovrà»: Taylor non dice come stanno le cose, dice come devono andare. È la tesi di tutto il libro, detta in una riga.","etichetta":"2a","gruppo":2},{"tipo":"class","id":"p2_c2","frase":"«Il lavoro di ogni operaio è interamente pianificato dalla direzione almeno un giorno prima.»","ok":0,"why":"Qui Taylor descrive come funziona il suo sistema: chi pianifica, quando. Il giudizio non è in questa frase, ma nella scelta di presentare questo modo di lavorare come «scientifico».","etichetta":"2b","gruppo":2},{"tipo":"class","id":"p2_c3","frase":"«Primo: [i dirigenti] sviluppano una scienza per ogni elemento del lavoro di un uomo, che prende il posto del vecchio metodo empirico.»","ok":1,"why":"È la frase più insidiosa. Il verbo è all’indicativo («sviluppano»), ma Taylor la presenta come il primo dei «nuovi doveri» dei dirigenti: dice che cosa devono fare. E l’aggettivo «vecchio» contiene già un giudizio sul modo di lavorare di prima.","etichetta":"2c","gruppo":2},{"tipo":"class","id":"p2_c4","frase":"«In passato era lui [l’operaio] a scegliersi il lavoro e ad addestrarsi come meglio poteva.»","ok":0,"why":"Descrive com’era il lavoro prima. Ma guarda «come meglio poteva»: anche in una descrizione si sente da che parte sta chi scrive.","etichetta":"2d","gruppo":2},{"tipo":"aperta","id":"p2_q2","prompt":"Secondo Taylor, chi pensa il lavoro e chi lo esegue? Che cosa perde l’operaio, rispetto a prima?","righe":4,"intro":"Una buona risposta contiene almeno i primi due punti:","punti":["chi pensa: la direzione, che studia il lavoro, lo pianifica il giorno prima e consegna istruzioni scritte; chi esegue: l’operaio","che cosa perde l’operaio: la scelta di come lavorare e la formazione che si dava da sé, cioè il sapere del mestiere. È la «dequalificazione» della slide sul sistema di fabbrica","in più: Taylor la presenta come una divisione «quasi uguale» del lavoro e della responsabilità tra direzione e operai. Chi la legge come una perdita, e chi come un vantaggio (più produttività, istruzioni chiare), deve dire perché"],"etichetta":"3"}],"approfondimento":{"titolo":"Che cosa c’è intorno al brano","testo":["Adam Smith, nel 1776, aveva descritto la divisione del lavoro nella fabbrica di spilli. Più di un secolo dopo Taylor va oltre: vuole misurare il lavoro, gesto per gesto, con il cronometro, per trovare il modo più rapido di svolgere ogni operazione. Scrive che, per ogni elemento di un mestiere, c’è sempre un metodo e uno strumento più rapido e migliore degli altri.","Nella slide il taylorismo è accostato alla catena di montaggio. Sono due cose vicine ma diverse: la catena di montaggio è introdotta da Henry Ford nelle sue fabbriche di automobili nel 1913, due anni dopo questo libro. Taylor non parla di catene: parla di chi pensa il lavoro e di chi lo esegue."]}},{"titolo":"Parte 3 — Lo Sherman Act","meta":"Guida media · 10 minuti","contesto":["Negli Stati Uniti di fine Ottocento alcune imprese arrivano a controllare interi settori: la più nota è la Standard Oil di John D. Rockefeller, nel petrolio. Nel 1890 il Congresso degli Stati Uniti approva questa legge, proposta dal senatore John Sherman."],"fonte":{"tipo":"testo","paragrafi":["«Sezione 1. Ogni contratto, ogni associazione in forma di trust o in altra forma, e ogni cospirazione che limiti il commercio fra i diversi Stati o con le nazioni straniere è con la presente dichiarato illegale. […]","Sezione 2. Chiunque monopolizzi o tenti di monopolizzare, o si associ o cospiri con altri per monopolizzare, una qualunque parte del commercio fra i diversi Stati o con le nazioni straniere, sarà considerato colpevole di reato e, se condannato, sarà punito con una multa fino a cinquemila dollari o con il carcere fino a un anno, o con entrambe le pene, a discrezione del tribunale.»"],"didascalia":"Sherman Antitrust Act, 2 luglio 1890, sezioni 1 e 2 (Stati Uniti). Traduzione di lavoro per uso didattico."},"domande":[{"tipo":"mc","id":"p3_q1","prompt":"Contro che cosa è diretta questa legge?","opts":["Contro i sindacati operai, che organizzano gli scioperi nelle fabbriche e nelle ferrovie","Contro le merci straniere, per proteggere le industrie americane dalla concorrenza","Contro gli accordi tra imprese che eliminano la concorrenza e creano monopoli","Contro le banche, per impedire che prestino denaro alle grandi imprese industriali"],"ok":2,"why":"Il testo vieta i contratti, i trust e le cospirazioni che «limitano il commercio», e punisce chi «monopolizza». Il bersaglio è la concentrazione: imprese che si accordano o si fondono per non farsi concorrenza. Le merci straniere non c’entrano: per quelle, nello stesso 1890, gli Stati Uniti approvano dazi altissimi, con un’altra legge.","etichetta":"1"},{"tipo":"aperta","id":"p3_q2","prompt":"La legge dice soltanto che cosa è vietato. Quale idea di economia c’è dietro il divieto, e chi vuole proteggere?","righe":4,"intro":"Una buona risposta contiene almeno i primi due punti:","punti":["l’idea: la concorrenza è un bene da difendere, e un potere economico troppo concentrato è una minaccia, tanto che chi monopolizza commette un reato","chi protegge: i piccoli produttori e commercianti, gli agricoltori, i consumatori, cioè chi rischia di dover comprare o vendere a prezzi decisi da un solo padrone del mercato","chi coglie il paradosso ha fatto un passo in più: lo Stato interviene sul mercato per salvare il mercato, cioè la libera concorrenza, dalle imprese più grandi","va bene anche notare un limite: «limitare il commercio» è un’espressione vaga, e una legge non dice da sola quanto verrà applicata"],"etichetta":"2"}],"approfondimento":{"titolo":"Che cosa c’è intorno alla legge","testo":["Lo Sherman Act è la prima grande legge contro i monopoli. Una legge sembra dire soltanto fatti («questo è vietato»), ma dietro il divieto c’è una presa di posizione: che la concentrazione del potere economico sia una minaccia da combattere.","Nei primi anni la legge fu applicata poco e con fatica. La Standard Oil fu divisa in più società solo nel 1911, dopo una sentenza della Corte suprema. E nello stesso 1890 il Congresso approvò anche una legge sui dazi fortemente protezionista: lo Stato interveniva sull’economia in più modi, e non sempre nella stessa direzione."]}},{"titolo":"Parte 4 — Collegare le fonti alla slide","meta":"Guida media · 6 minuti","contesto":["Questa è la slide della lezione. Come negli altri laboratori: uno schema mette in ordine molte cose in poche parole, una fonte ne mostra una sola, da vicino. Per ciascuna fonte, scegli l’elemento della slide che documenta."],"fonte":{"tipo":"img","file":"slide","alt":"Slide della lezione, intitolata «La riorganizzazione del sistema produttivo». Schema a frecce descritto per esteso nel testo che segue.","didascalia":"Slide della lezione: «La riorganizzazione del sistema produttivo»."},"trascrizione":"In alto a sinistra «crisi agricola», con una freccia verso «SOVRAPPRODUZIONE»; sotto, un riquadro con un elenco: eccesso di offerta, crollo dei prezzi, fallimenti, disoccupazione, diminuzione della domanda, eccesso di offerta, e così via. «Sovrapproduzione» e «speculazioni finanziarie» portano a «Grande depressione (1873-1896)», che porta a «Riorganizzazione del sistema produttivo». Questa ha quattro voci, ciascuna con una freccia: concentrazione del capitale → monopoli (trust, cartelli, holding); organizzazione scientifica del lavoro → taylorismo (catena di montaggio); introduzione del Gold Standard → stabilità monetaria; intervento statale → protezionismo e colonialismo.","nodi":["Crisi agricola","Sovrapproduzione","Speculazioni finanziarie","Grande depressione (1873-1896)","Crollo dei prezzi","Riorganizzazione del sistema produttivo","Concentrazione del capitale","Monopoli (Trust, Cartelli, Holding)","Organizzazione scientifica del lavoro","Taylorismo (catena di montaggio)","Introduzione del Gold Standard","Stabilità monetaria","Intervento statale","Protezionismo – Colonialismo"],"domande":[{"tipo":"nodo","id":"p4_n1","prompt":"Quale elemento della slide è documentato dalla tabella dei prezzi e della produzione?","ok":[4,3,1],"why":"Reggono «Crollo dei prezzi» e «Grande depressione»: la tabella mostra proprio la lunga discesa dei prezzi tra il 1873 e il 1896. Regge anche «Sovrapproduzione», con un’avvertenza: la tabella mostra prezzi giù e produzione su, cosa compatibile con la sovrapproduzione, ma non la dimostra. Che le merci fossero «troppe» è un’interpretazione.","etichetta":"1"},{"tipo":"nodo","id":"p4_n2","prompt":"Quale elemento della slide è documentato dal brano di Taylor?","ok":[8,9],"why":"Reggono «Organizzazione scientifica del lavoro», che è quasi il titolo del libro, e «Taylorismo». Ma attenzione alla parentesi della slide: il brano non parla di catena di montaggio, che è di Ford (1913). Documenta la pianificazione del lavoro da parte della direzione.","etichetta":"2"},{"tipo":"aperta","id":"p4_m2","prompt":"Motiva in una riga: quale frase del brano te lo fa dire?","righe":2,"intro":"Una buona motivazione cita il testo:","punti":["«Il lavoro di ogni operaio è interamente pianificato dalla direzione almeno un giorno prima»","oppure «sviluppano una scienza per ogni elemento del lavoro di un uomo»","non basta «parla di Taylor»: serve la frase"],"etichetta":""},{"tipo":"nodo","id":"p4_n3","prompt":"Quale elemento della slide è documentato dallo Sherman Act?","ok":[7,12,6],"why":"Reggono «Monopoli (Trust…)» e «Concentrazione del capitale», perché la legge esiste proprio perché i trust esistono, e «Intervento statale», perché è lo Stato che fa la legge. Ma guarda la direzione: nella slide concentrazione e intervento statale sono due risposte alla crisi, una accanto all’altra. Qui lo Stato interviene contro la concentrazione.","etichetta":"3"},{"tipo":"aperta","id":"p4_m3","prompt":"Motiva in una riga: quale parola o frase della legge te lo fa dire?","righe":2,"intro":"Una buona motivazione cita il testo:","punti":["«associazione in forma di trust», oppure «chiunque monopolizzi o tenti di monopolizzare»","per «Intervento statale»: il Congresso vieta e punisce con multa e carcere","non basta «parla dei monopoli»: serve la parola"],"etichetta":""}],"approfondimento":null},{"titolo":"Parte 4 — Collegare le fonti alla slide","meta":"Ultima domanda · 3 minuti","contesto":["Guarda di nuovo la slide e ripensa alle tre fonti."],"fonte":{"tipo":"img","file":"slide","alt":"Slide della lezione, intitolata «La riorganizzazione del sistema produttivo».","didascalia":"Slide della lezione: «La riorganizzazione del sistema produttivo»."},"domande":[{"tipo":"aperta","id":"p4_q1","prompt":"Che cosa aggiungono o complicano le fonti rispetto allo schema della slide? Indica almeno una cosa precisa.","righe":4,"intro":"Non c’è una sola risposta. Una buona risposta indica almeno una di queste cose, con la fonte da cui viene:","punti":["lo Sherman Act complica la freccia «concentrazione del capitale → monopoli»: negli Stati Uniti lo Stato interviene proprio contro i monopoli","Taylor scrive nel 1911, quindici anni dopo la fine della Grande depressione: la riorganizzazione è una tendenza lunga, non una risposta immediata alla crisi","Taylor non parla di catena di montaggio: la parentesi della slide unisce due cose diverse","la tabella mostra che la produzione cresce mentre i prezzi scendono: «depressione» per chi? Lo schema non dice chi ci perde e chi ci guadagna","le fonti mostrano chi pensa il lavoro e chi lo esegue, una cosa che nello schema non c’è"],"etichetta":"4"}],"approfondimento":null}],"chiusura":"Tieni a mente queste risposte: la prossima lezione riparte da qui.","ultimoMc":3,"tempoAtteso":1700,"caratteriAttesi":600,"minChar":20,"maxChar":1500};

      }
      else if (q.tipo === "nodo") { node = menuNodi(q, titoloDomanda(P, q), P.nodi); manca = function () { return S.mc[q.id] == null; }; }
      else { node = aperta(q, titoloDomanda(P, q), q.righe <= 3); manca = function () { return !okTesto(q.id); }; if (!q.etichetta) node.className = "q first"; }
      c.appendChild(node); campi.push({ node: node, manca: manca });
    });
    if (!fonteMessa) { var fo2 = fonteDi(P); if (fo2) c.appendChild(fo2); }
    if (S.step === BLOCCO) c.appendChild(el("div", "note", "Da qui non si torna indietro: le risposte a scelta sono definitive."));
    if (S.step === ULTIMO) c.appendChild(el("div", "note", "Quando consegni, le risposte non si possono più modificare e compare la correzione."));
    var err = el("div", "err"); err.setAttribute("role", "alert"); c.appendChild(err);
    var back = el("button", "btn sec", "Indietro"); back.type = "button"; back.disabled = bloccato;
    var next = el("button", "btn", S.step === ULTIMO ? "Consegna" : "Avanti"); next.type = "button";
    var row = el("div", "row"); add(row, back, next); c.appendChild(row);
    back.onclick = function () { if (!bloccato && S.step > 0) { S.step--; persist(); render(); } };
    next.onclick = function () {
      var mancanti = campi.filter(function (f) { return f.manca(); });
      if (mancanti.length) {
        err.textContent = (mancanti.length === 1 ? "Manca ancora una risposta." : "Mancano ancora " + mancanti.length + " risposte.") + " Le risposte scritte devono avere almeno " + MINC + " caratteri.";
        var f = mancanti[0].node._focus; if (f) f.focus();
        return;
      }
      if (S.step < ULTIMO) { S.step++; persist(); render(); } else consegna(next, err);
    };
    function pulisci(ev) { if (ev.target !== next && err.textContent) err.textContent = ""; }
    c.addEventListener("input", pulisci); c.addEventListener("change", pulisci); c.addEventListener("click", pulisci);
    app.appendChild(c);
    window.scrollTo(0, 0);
    try { h2.focus({ preventScroll: true }); } catch (e) { h2.focus(); }
  }

  function renderAvvio() {
    var c = el("div", "card");
    var h2 = el("h2", null, D.richiamo.titolo); h2.tabIndex = -1; c.appendChild(h2);
    D.richiamo.testo.forEach(function (t) { c.appendChild(el("p", null, t)); });
    var b = el("button", "btn", "Comincia"); b.type = "button";
    b.onclick = function () { S.step = 1; persist(); render(); };
    var row = el("div", "row"); add(row, el("span"), b); c.appendChild(row);
    app.appendChild(c);
    window.scrollTo(0, 0);
  }

  function opzioniDi(P, q) { return q.tipo === "mc" ? q.opts : q.tipo === "class" ? P.classOpzioni : P.nodi; }
  function giustaDi(P, q, k) { return q.tipo === "nodo" ? q.ok.indexOf(k) !== -1 : k === q.ok; }
  function testoGiusta(P, q) {
    if (q.tipo === "nodo") return q.ok.map(function (j) { return "«" + P.nodi[j] + "»"; }).join(" oppure ");
    return opzioniDi(P, q)[q.ok];
  }

  function buildAnswers() {
    var list = [], right = 0, tot = 0;
    D.parti.forEach(function (P) {
      ordine(P).forEach(function (q) {
        if (q.tipo !== "aperta") {
          tot++;
          var k = S.mc[q.id]; if (k == null) return;
          var good = giustaDi(P, q, k); if (good) right++;
          list.push({ id: q.id, prompt: testoDomanda(q), type: "mc", answer: opzioniDi(P, q)[k], correct: good });
        } else {
          var t = (S.tx[q.id] || "").trim(); if (!t) return;
          list.push({ id: q.id, prompt: q.prompt, type: "essay", answer: t.slice(0, 4000), correct: null });
        }
      });
    });
    return { list: list, right: right, tot: tot, score: tot ? Math.round(right / tot * 100) : null };
  }

  var sending = false, tentativi = 0;
  function consegna(btn, err) {
    if (sending) return; sending = true; btn.disabled = true; err.textContent = "Consegna in corso…";
    var r = buildAnswers(), invio;
    try { invio = window.Addestramento ? Promise.resolve(window.Addestramento.completa(r.list, r.score)).catch(function () { return false; }) : Promise.resolve(false); }
    catch (e) { invio = Promise.resolve(false); }
    invio.then(function (ok) {
      if (ok === false && window.Addestramento && ++tentativi < 2) {
        sending = false; btn.disabled = false; btn.textContent = "Consegna (riprova)";
        err.textContent = "Invio non riuscito: controlla la connessione e riprova.";
        return;
      }
      S.sub = true; S.ok = (ok !== false); persist(); sending = false; render();
    });
  }

  function esito(good, tua) { var m = el("div", "res " + (good ? "ok" : "ko")); add(m, el("span", "lbl", good ? "Corretto — " : "Non corretto — "), document.createTextNode("la tua risposta: " + tua)); return m; }
  function giusta(text) { var g = el("div", "res ok"); add(g, el("span", "lbl", "Risposta giusta: "), document.createTextNode(text)); return g; }
  function cardChiusa(P, q) {
    var d = el("div", "card"), k = S.mc[q.id], good = k != null && giustaDi(P, q, k);
    d.appendChild(el("h3", null, q.tipo === "class" ? q.etichetta + ". Frase da classificare" : titoloDomanda(P, q)));
    if (q.tipo === "class") d.appendChild(el("blockquote", "src frase", q.frase));
    d.appendChild(esito(good, k == null ? "(nessuna)" : opzioniDi(P, q)[k]));
    if (!good) d.appendChild(giusta(testoGiusta(P, q)));
    d.appendChild(el("p", null, q.why));
    return d;
  }
  function cardAperta(P, q) {
    var d = el("div", "card");
    d.appendChild(el("h3", null, titoloDomanda(P, q)));
    d.appendChild(el("div", "lbl", "La tua risposta"));
    d.appendChild(el("div", "mine", (S.tx[q.id] || "").trim() || "(nessuna)"));
    var m = el("div", "model");
    m.appendChild(el("div", "lbl", "Modello di risposta"));
    m.appendChild(el("div", null, q.intro));
    var ul = el("ul"); q.punti.forEach(function (t) { ul.appendChild(el("li", null, t)); }); m.appendChild(ul);
    d.appendChild(m);
    d.appendChild(el("p", "note", "Confronta: che cosa avevi già scritto? Che cosa ti è sfuggito?"));
    return d;
  }
  function cardApprofondimento(a) { var d = el("div", "card"); d.appendChild(el("h3", null, a.titolo)); a.testo.forEach(function (t) { d.appendChild(el("p", null, t)); }); return d; }
  function parte(titolo) { var p = el("div", "part"); p.appendChild(el("h2", null, titolo)); return p; }

  function renderCorrezione() {
    var r = buildAnswers();
    var c = el("div", "card");
    var h2 = el("h2", null, "Esercitazione consegnata"); h2.tabIndex = -1; c.appendChild(h2);
    c.appendChild(el("div", "score", r.right + " su " + r.tot + " risposte chiuse corrette"));
    c.appendChild(el("p", null, "Qui sotto trovi la correzione. Leggila con calma: serve a capire che cosa ti manca, non a prendere un voto. Per le risposte scritte non c'è un esito automatico: confrontale tu con il modello."));
    c.appendChild(el("p", S.ok === false ? "note warn" : "note", S.ok === false ? "Attenzione: il risultato NON è stato registrato (connessione assente o bloccata). Avvisa il docente." : "Risultato registrato."));
    app.appendChild(c);
    D.parti.forEach(function (P, pi) {
      var stessa = pi > 0 && D.parti[pi - 1].titolo === P.titolo;
      if (!stessa) {
        app.appendChild(parte(P.titolo));
        var fo = fonteDi(P); if (fo) { var fc = el("div", "card"); fc.appendChild(fo); app.appendChild(fc); }
      }
      ordine(P).forEach(function (q) { app.appendChild(q.tipo === "aperta" ? cardAperta(P, q) : cardChiusa(P, q)); });
      if (P.approfondimento) app.appendChild(cardApprofondimento(P.approfondimento));
    });
    var fine = el("div", "card"); fine.appendChild(el("p", null, D.chiusura));
    if (S.ok === false) fine.appendChild(el("p", "note warn", "Ricorda: il risultato NON è stato registrato. Avvisa il docente."));
    app.appendChild(fine);
    window.scrollTo(0, 0);
    try { h2.focus({ preventScroll: true }); } catch (e) { h2.focus(); }
  }

  function avvia() {
    app = document.getElementById("app");
    if (!window.Addestramento) { render(); return; }
    try {
      window.Addestramento.start({
        labId: LAB_ID,
        title: D.titolo,
        salvaRisposte: true,                 // decisione esplicita: il docente legge le risposte finali
        tempoAtteso: D.tempoAtteso,          // secondi per uno studente concentrato
        caratteriAttesi: D.caratteriAttesi,  // caratteri complessivi nelle risposte aperte
        onReady: function () { app = document.getElementById("app"); render(); }
      });
    } catch (e) { render(); }
  }
  avvia();
})();
</script>
</body>
</html>
