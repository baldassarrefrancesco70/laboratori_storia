(function () {
  "use strict";
  var D = {"labId":"storia_sistema_di_fabbrica_fonti","titolo":"Il sistema di fabbrica: due fonti e uno schema","tipologiaEtichetta":"Analizzare testi","richiamo":{"titolo":"Prima di cominciare","testo":["Una fonte non è una finestra aperta sul passato: è qualcosa che qualcuno ha prodotto, in un certo momento, per qualcuno. Per questo, prima di chiederle che cosa dice, le si chiede chi parla, quando e a chi. Poi si separano due cose che nelle fonti stanno quasi sempre insieme: ciò che la fonte descrive e ciò che la fonte valuta.","Lavori da solo. Hai circa 40 minuti: 13 per un brano di Adam Smith, 12 per un dipinto, 10 per collegare le due fonti alla slide della lezione. Alla fine consegni e vedi la correzione.","Se della lezione sul sistema di fabbrica ricordi poco, riguarda il capitolo del manuale sulla rivoluzione industriale. Se hai con te gli appunti, tienili aperti: nell’ultima parte ti servono."]},"p1":{"titolo":"Parte 1 — Adam Smith e la fabbrica di spilli","meta":"Guida alta · 13 minuti","contesto":"Adam Smith (1723-1790) è scozzese e ha insegnato filosofia morale all’università di Glasgow. Il libro da cui viene il brano esce a Londra nel 1776.","aTitolo":"Prima di leggere: il paratesto","aMin":"4 minuti","aIstruzioni":"Il paratesto è ciò che sta intorno a un testo: autore, data, titolo. Per ora guarda solo questo e rispondi alle due domande. Il brano arriva dopo.","paratesto":[["Autore","Adam Smith"],["Anno e luogo","1776, Londra"],["Titolo","Indagine sulla natura e le cause della ricchezza delle nazioni"]],"mc":[{"id":"p1_q1","prompt":"Guarda il titolo. Che tipo di opera annuncia?","opts":["Un resoconto di viaggio, che descrive i paesi più ricchi visitati dall’autore","Un manuale pratico, che insegna ai mercanti come far crescere il patrimonio","Una ricerca delle cause: vuole spiegare perché un paese è ricco","Una raccolta di leggi sul commercio, emanate dal governo e commentate dall’autore"],"ok":2,"why":"Le parole che contano sono «indagine», «natura» e «cause»: chi le usa vuole spiegare un fenomeno risalendo a ciò che lo produce. E l’oggetto sono le «nazioni», non i singoli: per questo non è un manuale per arricchirsi. Un resoconto di viaggio o una raccolta di leggi descrivono; questo titolo promette una spiegazione."},{"id":"p1_q2","prompt":"Metti insieme autore, anno e titolo. Che cosa puoi aspettarti dal brano, prima ancora di leggerlo?","opts":["Dati neutri, riportati senza prendere posizione, perché è un’opera di scienza","Una tesi sull’origine della ricchezza, con esempi scelti per sostenerla","Il racconto della sua esperienza personale di operaio in una manifattura","La descrizione delle grandi fabbriche a vapore, ormai diffuse in Inghilterra"],"ok":1,"why":"Chi annuncia di cercare le «cause» della ricchezza ha una risposta da proporre, cioè una tesi, e sceglie gli esempi che la rendono convincente: è la cosa da tenere d’occhio mentre leggi. Le altre risposte non reggono. Smith è un professore di filosofia, non un operaio. Il 1776 è presto: la macchina a vapore di Watt entra in commercio proprio in quegli anni e le fabbriche a vapore non sono ancora diffuse. Quanto ai «dati neutri»: anche un’opera che vuole essere scientifica sceglie che cosa mostrare."}],"bTitolo":"Il brano","bMin":"9 minuti","bIstruzioni":"Ora leggi il brano: è l’inizio del primo capitolo.","brano":"«Il più grande miglioramento delle capacità produttive del lavoro […] sembra essere stato l’effetto della divisione del lavoro. […] Prendiamo un esempio: la fabbricazione degli spilli. Un operaio non addestrato a questo mestiere […] potrebbe forse, con tutto l’impegno, fabbricare un solo spillo al giorno, e certamente non venti. Ma per il modo in cui il lavoro è oggi organizzato, […] esso è diviso in circa diciotto operazioni distinte, ciascuna affidata a mani diverse. […] Dieci persone, così, potevano produrre tra loro oltre quarantottomila spilli in un giorno.»","didascalia":"A. Smith, Indagine sulla natura e le cause della ricchezza delle nazioni, 1776, libro I, cap. 1. Traduzione di lavoro per uso didattico; i tagli sono segnalati con […].","classIstruzioni":"Per ciascuna frase scegli: la frase descrive come stanno le cose, oppure le valuta (dice che cosa è meglio, più importante, un bene o un male)?","classOpzioni":["Descrive","Valuta"],"classifica":[{"id":"p1_c1","testo":"«Il più grande miglioramento delle capacità produttive del lavoro […] sembra essere stato l’effetto della divisione del lavoro.»","ok":1,"why":"«Il più grande miglioramento»: Smith mette in ordine d’importanza e chiama «miglioramento» ciò di cui parla. È un giudizio, ed è anche la tesi di tutto il brano. Nota il verbo «sembra»: presenta il giudizio come una constatazione prudente. È il punto in cui descrivere e valutare sono più difficili da separare."},{"id":"p1_c2","testo":"«Un operaio non addestrato a questo mestiere […] potrebbe forse, con tutto l’impegno, fabbricare un solo spillo al giorno, e certamente non venti.»","ok":0,"why":"Smith non dice se è un bene o un male: dice quanto produrrebbe un operaio da solo. Attenzione però a «potrebbe forse»: non è un conteggio, è una stima. La frase descrive, ma non riferisce un fatto osservato."},{"id":"p1_c3","testo":"«Ma per il modo in cui il lavoro è oggi organizzato, […] esso è diviso in circa diciotto operazioni distinte, ciascuna affidata a mani diverse.»","ok":0,"why":"È la descrizione di come è organizzato il lavoro: quante operazioni, affidate a chi. Nessun giudizio."},{"id":"p1_c4","testo":"«Dieci persone, così, potevano produrre tra loro oltre quarantottomila spilli in un giorno.»","ok":0,"why":"È un numero, quindi una descrizione. Ma chiediti perché Smith ha scelto proprio questo numero: è la prova che sostiene la frase iniziale. Una descrizione può lavorare per una tesi anche senza contenere giudizi."}],"aperta":{"id":"p1_q3","prompt":"Una riga. Secondo Smith, da dove nasce l’enorme aumento di produzione?","righe":2,"intro":"Una buona risposta contiene almeno i primi due punti:","punti":["nasce dalla divisione del lavoro: il lavoro è scomposto in operazioni distinte (circa diciotto), affidate a persone diverse","non nasce da più lavoratori o da più ore: le persone sono sempre dieci, cambia il modo in cui il lavoro è organizzato","se hai fatto il conto è ancora meglio: 48.000 spilli diviso dieci persone fa 4.800 a testa, contro uno solo (e «certamente non venti») per chi lavora da solo"]},"approfondimento":{"titolo":"Che cosa c’è intorno al brano","testo":["Con quest’opera, uscita nel 1776, si fa di solito cominciare l’economia politica. La domanda del titolo è un programma: da dove viene la ricchezza di un paese? La risposta di Smith parte da un’osservazione minuta, una manifattura di spilli. Nel brano descrizione e giudizio stanno nelle stesse righe: Smith descrive come la produzione si moltiplica e insieme pensa che sia un bene, perché secondo lui la ricchezza delle nazioni nasce di qui.","Due cose che il brano, così tagliato, non dice. La prima: nel testo completo Smith racconta di aver visto di persona una piccola manifattura con dieci operai, e il numero di 48.000 spilli lo ricava con un calcolo (circa dodici libbre di spilli al giorno, più di quattromila spilli per libbra). La seconda: subito dopo spiega l’aumento con tre ragioni. Chi ripete la stessa operazione diventa più abile; non si perde tempo a passare da un lavoro all’altro; chi fa una cosa sola è portato a inventare macchine che la abbreviano."]}},"p2":{"titolo":"Parte 2 — Coalbrookdale di notte","meta":"Guida media · 12 minuti","contesto":"Coalbrookdale è una valle dell’Inghilterra occidentale dove, dall’inizio del Settecento, si produce ferro. Philip James de Loutherbourg (1740-1812), pittore di paesaggi, ha lavorato a lungo per i teatri di Londra. Questo quadro viene esposto nel 1801 a Londra, alla mostra annuale della Royal Academy.","istruzioni":"Guarda il dipinto con calma prima di rispondere. Qui le domande sono aperte: bastano poche righe, purché dicano che cosa hai visto.","didascalia":"P. J. de Loutherbourg, Coalbrookdale by Night (Coalbrookdale di notte), 1801, olio su tela, 68 × 107 cm. Londra, Science Museum.","alt":"Dipinto a olio. Al centro, dietro un gruppo di edifici scuri con ciminiere, un grande bagliore giallo e arancione da cui salgono fiamme e fumo. Nuvole di fumo rosse e arancioni coprono gran parte del cielo; a destra resta un angolo di cielo notturno blu, con la luna sul margine. A sinistra una casa e un albero in controluce. In primo piano una strada: due cavalli tirano un carro, a terra ci sono grossi pezzi cilindrici di ferro, poche figure piccole camminano o guardano.","aperte":[{"id":"p2_q1","prompt":"Sourcing. Chi ha realizzato quest’immagine e quando? È la registrazione di ciò che c’era o un’interpretazione? Indica un elemento del dipinto che te lo fa pensare.","righe":4,"intro":"Una buona risposta contiene almeno i primi tre punti:","punti":["autore e data: de Loutherbourg, 1801; un pittore che ha lavorato per il teatro, non un tecnico né un testimone che prende appunti","è un’interpretazione: un quadro a olio si costruisce in studio, e l’autore ha scelto l’ora, il punto di vista e i colori","un elemento preciso del dipinto, per esempio: la scelta della notte, che fa risaltare il fuoco; il bagliore che occupa il centro e gran parte del cielo; gli edifici ridotti a sagome scure; la luna piccola sul margine destro; le figure minuscole in primo piano","in più: interpretazione non vuol dire invenzione. Il luogo e le fornaci esistevano; ed è un quadro fatto per il pubblico di una mostra, a Londra"]},{"id":"p2_q2","prompt":"Descrivi in due righe che cosa vedi al centro e che cosa fa il cielo. L’autore sembra volerti stupire, spaventare, o entrambe le cose?","righe":4,"intro":"Una buona risposta prima descrive e poi interpreta:","punti":["al centro: un bagliore giallo e arancione, da cui salgono fiamme e fumo; davanti, edifici scuri con le ciminiere","il cielo: nuvole di fumo illuminate dal basso, rosse e arancioni, che lo coprono quasi tutto; il cielo notturno resta solo in un angolo, a destra, con la luna","l’effetto: va bene ciascuna delle tre risposte, se la motivi con ciò che vedi. Stupire: è uno spettacolo di luce e di colore. Spaventare: sembra un incendio, e le persone sono piccolissime. Entrambe: è la risposta più vicina al modo in cui il quadro fu guardato allora"]},{"id":"p2_q3","prompt":"Una riga. Nel dipinto, che cosa fanno le fornaci a ciò che hanno intorno (cielo, alberi, case)?","righe":2,"intro":"Una buona risposta contiene almeno uno dei primi tre punti, detto con precisione:","punti":["il fuoco e il fumo coprono il cielo e cancellano la notte: la luce viene dalle fornaci più che dalla luna","alberi e case diventano sagome scure in controluce: ciò che sta intorno fa da cornice","in primo piano il terreno è ingombro di pezzi di ferro, e ci passa un carro","attenzione a non far dire al quadro più di quello che mostra: non si vedono alberi morti o acque sporche. Si vede una presenza che domina tutto il resto"]}],"approfondimento":{"titolo":"Che cosa c’è intorno al dipinto","testo":["Coalbrookdale è uno dei luoghi in cui nasce l’industria del ferro: qui, nel 1709, Abraham Darby comincia a fondere il minerale di ferro con il carbon coke invece che con il carbone di legna. Un secolo dopo la valle è un paesaggio di altiforni accesi giorno e notte, che attira viaggiatori e pittori.","De Loutherbourg ci passa due volte, nel 1786 e nel 1800, e ne riporta degli schizzi; il quadro lo dipinge poi a Londra. Costruire effetti di luce è il suo mestiere: per anni ha lavorato alle scene dei teatri londinesi. È un dipinto, e nel 1801 la fotografia non esiste ancora: tutto ciò che vedi è stato scelto. Quel cielo in fiamme è insieme meraviglioso e inquietante. Gli storici dell’arte lo chiamano «sublime» industriale: lo stupore e la paura davanti a una potenza nuova."]}},"p3":{"titolo":"Parte 3 — Collegare le fonti alla slide","meta":"Guida media · 10 minuti","istruzioni":"Questa è la slide della lezione sul sistema di fabbrica. Uno schema mette in ordine molte cose in poche parole; una fonte ne mostra una sola, da vicino. Il tuo compito è dire quale.","didascalia":"Slide della lezione: «Il sistema di fabbrica».","alt":"Slide della lezione, intitolata «Il sistema di fabbrica». Schema a frecce descritto per esteso nel testo che segue.","trascrizioneTitolo":"Lo schema della slide, a parole","trascrizione":"In alto tre riquadri: «Meccanizzazione della produzione», «Concentrazione della produzione», «Connessione con vie di comunicazione». Tre frecce li collegano a «nasce la FABBRICA». Da qui una freccia scende a un riquadro con tre voci: «Divisione del lavoro», «Urbanizzazione», «Inquinamento». Da «Divisione del lavoro» partono due frecce: una verso «aumento della produttività», una verso «dequalificazione», e da questa un’altra freccia porta a «sfruttamento». Dal riquadro una freccia scende a «trasformazioni sociali».","nodi":["Meccanizzazione della produzione","Concentrazione della produzione","Connessione con vie di comunicazione","Divisione del lavoro","Urbanizzazione","Inquinamento","Aumento della produttività","Dequalificazione","Sfruttamento"],"collegamenti":[{"nodo":{"id":"p3_n1","prompt":"Quale elemento della slide è documentato dal brano di Smith?","ok":[3,6],"why":"Reggono due risposte: «Divisione del lavoro» (è l’argomento del brano: diciotto operazioni, mani diverse) e «Aumento della produttività» (da uno spillo al giorno a 4.800 a testa). Le altre no. «Dequalificazione» e «Sfruttamento»: il brano non dice nulla di come vivono gli operai né di che cosa perdono; la freccia è nella slide, non nel testo. «Meccanizzazione»: in queste righe non compare nessuna macchina. «Concentrazione»: le dieci persone lavorano nello stesso posto, ma il brano parla di come si dividono il lavoro, non del fatto che siano riunite."},"motivazione":{"id":"p3_m1","prompt":"Motiva in una riga: quale parola o frase del brano te lo fa dire?","righe":2,"intro":"Una buona motivazione cita il testo:","punti":["per «Divisione del lavoro»: «diviso in circa diciotto operazioni distinte, ciascuna affidata a mani diverse»","per «Aumento della produttività»: il confronto tra «un solo spillo al giorno» e «oltre quarantottomila spilli» in dieci","non basta scrivere «parla di questo»: serve la parola o la frase"]}},{"nodo":{"id":"p3_n2","prompt":"Quale elemento della slide è documentato dal dipinto?","ok":[5,1],"why":"Reggono due risposte: «Inquinamento» (il fumo e il fuoco che coprono il cielo) e «Concentrazione della produzione» (fornaci, ciminiere ed edifici raccolti in un solo luogo). Le altre no. «Meccanizzazione»: si vedono fuoco e ciminiere, non macchine al lavoro. «Urbanizzazione»: è una valle con poche case, non una città. «Connessione con vie di comunicazione»: il carro a cavalli c’è, ma è il trasporto di sempre; il dipinto non mostra canali né strade nuove. «Sfruttamento»: gli operai sono figure piccole e lontane, e del loro lavoro non si vede quasi nulla."},"motivazione":{"id":"p3_m2","prompt":"Motiva in una riga: quale elemento del dipinto te lo fa dire?","righe":2,"intro":"Una buona motivazione indica che cosa si vede:","punti":["per «Inquinamento»: le nuvole di fumo illuminate dal fuoco, che coprono quasi tutto il cielo","per «Concentrazione della produzione»: fornaci, ciminiere, edifici e materiali raccolti nello stesso luogo","una precisazione utile: «inquinamento» è una parola nostra. Il pittore mostra il fumo come uno spettacolo, non come un danno: siamo noi a leggerlo così"]}}],"finale":{"id":"p3_q3","prompt":"Guarda di nuovo la slide. Quale parte dello schema non è documentata da nessuna delle due fonti? Che tipo di fonte ti servirebbe per documentarla? Se hai con te gli appunti della lezione, aggiungi una cosa che lì hai scritto e che né la slide né le fonti dicono.","righe":6,"intro":"Una buona risposta contiene almeno i primi tre punti:","punti":["una parte precisa dello schema, per esempio: «dequalificazione → sfruttamento», «urbanizzazione», «connessione con vie di comunicazione», «meccanizzazione»","il perché: Smith parla di quanto si produce, non di chi produce; il dipinto mostra le fornaci da fuori e da lontano, non il lavoro","un tipo di fonte adatto alla parte scelta. Per lo sfruttamento: la testimonianza di un operaio, un’inchiesta sul lavoro nelle fabbriche, un regolamento di fabbrica. Per l’urbanizzazione: i dati sulla popolazione di una città, una pianta. Per le vie di comunicazione: una carta dei canali. Per la meccanizzazione: il disegno o il brevetto di una macchina","dagli appunti: qui non c’è una risposta modello. Vale qualunque aggiunta precisa: un nome, una data, un esempio, un nesso. Se non avevi gli appunti, questa parte non conta"]}},"chiusura":"Tieni a mente queste risposte: la prossima lezione riparte da qui.","tempoAtteso":1500,"caratteriAttesi":800,"minChar":20,"maxChar":1500};

    D.p3.nodi.forEach(function (t, i) { var o = el("option", null, t); o.value = String(i); sel.appendChild(o); });
    sel.value = S.mc[q.id] == null ? "" : String(S.mc[q.id]);
    sel.onchange = function () { if (sel.value === "") delete S.mc[q.id]; else S.mc[q.id] = Number(sel.value); persist(); };
    add(w, lab, sel);
    w._focus = sel;
    return w;
  }
  function okTesto(id) { return (S.tx[id] || "").trim().length >= MINC; }

  // ── i passi
  var PASSI = [
    null,
    { nome: D.p1.titolo, meta: D.p1.aTitolo + " · " + D.p1.aMin },
    { nome: D.p1.titolo, meta: D.p1.bTitolo + " · " + D.p1.bMin, bloccato: "Da qui non si torna alle domande sul paratesto: andavano date prima di leggere il brano." },
    { nome: D.p2.titolo, meta: D.p2.meta },
    { nome: D.p3.titolo, meta: D.p3.meta },
    { nome: D.p3.titolo, meta: "Ultima domanda", bloccato: "Da qui non si torna indietro: le scelte fatte sulla slide sono definitive." }
  ];

  function render() {
    uid = 0;
    clear();
    app.appendChild(testata());
    if (S.sub) { renderCorrezione(); return; }
    if (S.step === 0) { renderAvvio(); return; }

    var P = PASSI[S.step];
    var c = el("div", "card");
    add(c, el("div", "sub", "Passo " + S.step + " di " + ULTIMO));
    var bar = el("div", "bar"); var fill = el("i"); fill.style.width = Math.round((S.step - 1) / ULTIMO * 100) + "%"; bar.appendChild(fill); c.appendChild(bar);
    var h2 = el("h2", null, P.nome); h2.tabIndex = -1; c.appendChild(h2);
    c.appendChild(el("div", "sub", P.meta));

    var campi = []; // { nodo, manca() }
    function campo(node, manca) { c.appendChild(node); campi.push({ node: node, manca: manca }); return node; }

    if (S.step === 1) {
      add(c, el("p", null, D.p1.contesto), el("p", null, D.p1.aIstruzioni));
      var dl = el("dl", "para");
      D.p1.paratesto.forEach(function (r) {
        var d = el("div"), dd = el("dd");
        if (r[0] === "Titolo") dd.appendChild(el("em", null, r[1])); else dd.textContent = r[1];
        add(d, el("dt", null, r[0]), dd); dl.appendChild(d);
      });
      c.appendChild(dl);
      D.p1.mc.forEach(function (q, i) {
        campo(scelta({ id: q.id, etichetta: (i + 1) + ". " + q.prompt }, q.opts), function () { return S.mc[q.id] == null; });
      });
    }
    if (S.step === 2) {
      add(c, el("p", null, D.p1.bIstruzioni), fonte(D.p1.brano), el("p", "dida", D.p1.didascalia));
      add(c, el("h3", null, "3. " + D.p1.classIstruzioni));
      D.p1.classifica.forEach(function (f, i) {
        var n = campo(scelta({ id: f.id, etichetta: "Frase " + "abcd".charAt(i), fonte: f.testo }, D.p1.classOpzioni, true), function () { return S.mc[f.id] == null; });
        if (i === 0) n.className = "q first";
      });
      campo(aperta({ id: D.p1.aperta.id, etichetta: "4. " + D.p1.aperta.prompt }, true), function () { return !okTesto(D.p1.aperta.id); });
    }
    if (S.step === 3) {
      add(c, el("p", null, D.p2.contesto), el("p", null, D.p2.istruzioni), figura(IMG_DIPINTO, D.p2.alt, D.p2.didascalia));
      D.p2.aperte.forEach(function (q, i) {
        campo(aperta({ id: q.id, etichetta: (i + 1) + ". " + q.prompt }, q.righe <= 2), function () { return !okTesto(q.id); });
      });
    }
    if (S.step === 4) {
      add(c, el("p", null, D.p3.istruzioni), slide());
      D.p3.collegamenti.forEach(function (cg, i) {
        campo(menuNodi({ id: cg.nodo.id, etichetta: (i + 1) + ". " + cg.nodo.prompt }), function () { return S.mc[cg.nodo.id] == null; });
        var m = campo(aperta({ id: cg.motivazione.id, etichetta: cg.motivazione.prompt }, true), function () { return !okTesto(cg.motivazione.id); });
        m.className = "q first";
      });
    }
    if (S.step === 5) {
      c.appendChild(slide());
      c.appendChild(el("p", null, "Le tue scelte:"));
      var ul = el("ul", "recap");
      D.p3.collegamenti.forEach(function (cg, i) {
        var li = el("li");
        add(li, el("span", "lbl", (i === 0 ? "Brano di Smith" : "Dipinto") + " → "), document.createTextNode(S.mc[cg.nodo.id] == null ? "(nessuna scelta)" : D.p3.nodi[S.mc[cg.nodo.id]]));
        ul.appendChild(li);
      });
      c.appendChild(ul);
      var fin = campo(aperta({ id: D.p3.finale.id, etichetta: "3. " + D.p3.finale.prompt }), function () { return !okTesto(D.p3.finale.id); });
      fin.className = "q first";
    }

    if (P.bloccato) c.appendChild(el("div", "note", P.bloccato));
    if (S.step === ULTIMO) c.appendChild(el("div", "note", "Quando consegni, le risposte non si possono più modificare e compare la correzione."));

    var err = el("div", "err"); err.setAttribute("role", "alert"); c.appendChild(err);
    var back = el("button", "btn sec", "Indietro"); back.type = "button"; back.disabled = !!P.bloccato;
    var next = el("button", "btn", S.step === ULTIMO ? "Consegna" : "Avanti"); next.type = "button";
    var row = el("div", "row"); add(row, back, next); c.appendChild(row);

    back.onclick = function () { if (!P.bloccato && S.step > 0) { S.step--; persist(); render(); } };
    next.onclick = function () {
      var mancanti = campi.filter(function (f) { return f.manca(); });
      if (mancanti.length) {
        err.textContent = mancanti.length === 1 ? "Manca ancora una risposta." : "Mancano ancora " + mancanti.length + " risposte.";
        err.textContent += " Le risposte scritte devono avere almeno " + MINC + " caratteri.";
        var f = mancanti[0].node._focus; if (f) { f.focus(); }
        return;
      }
      if (S.step < ULTIMO) { S.step++; persist(); render(); } else { consegna(next, back, err); }
    };
    // l'avviso sparisce appena lo studente riprende a rispondere
    function pulisci(ev) { if (ev.target !== next && err.textContent) err.textContent = ""; }
    c.addEventListener("input", pulisci); c.addEventListener("change", pulisci); c.addEventListener("click", pulisci);
    app.appendChild(c);
    window.scrollTo(0, 0);
    try { h2.focus({ preventScroll: true }); } catch (e) { h2.focus(); }
  }

  function renderAvvio() {
    var c = el("div", "card");
    var h2 = el("h2", null, D.richiamo.titolo); h2.tabIndex = -1; c.appendChild(h2);
    D.richiamo.testo.forEach(function (t) { c.appendChild(el("p", null, t)); });
    var b = el("button", "btn", "Comincia"); b.type = "button";
    b.onclick = function () { S.step = 1; persist(); render(); };
    var row = el("div", "row"); add(row, el("span"), b); c.appendChild(row);
    app.appendChild(c);
    window.scrollTo(0, 0);
  }

  // ── risposte per il registro
  function buildAnswers() {
    var list = [], right = 0, tot = 0;
    function chiusa(id, prompt, opts, okFn) {
      tot++;
      var k = S.mc[id]; if (k == null) return;
      var good = okFn(k); if (good) right++;
      list.push({ id: id, prompt: prompt, type: "mc", answer: opts[k], correct: good });
    }
    function testo(id, prompt) {
      var t = (S.tx[id] || "").trim(); if (!t) return;
      list.push({ id: id, prompt: prompt, type: "essay", answer: t.slice(0, 4000), correct: null });
    }
    D.p1.mc.forEach(function (q) { chiusa(q.id, q.prompt, q.opts, function (k) { return k === q.ok; }); });
    D.p1.classifica.forEach(function (f) { chiusa(f.id, f.testo, D.p1.classOpzioni, function (k) { return k === f.ok; }); });
    testo(D.p1.aperta.id, D.p1.aperta.prompt);
    D.p2.aperte.forEach(function (q) { testo(q.id, q.prompt); });
    D.p3.collegamenti.forEach(function (cg) {
      chiusa(cg.nodo.id, cg.nodo.prompt, D.p3.nodi, function (k) { return cg.nodo.ok.indexOf(k) !== -1; });
      testo(cg.motivazione.id, cg.motivazione.prompt);
    });
    testo(D.p3.finale.id, D.p3.finale.prompt);
    return { list: list, right: right, tot: tot, score: Math.round(right / tot * 100) };
  }

  var sending = false, tentativi = 0;
  function consegna(btn, back, err) {
    if (sending) return; sending = true; btn.disabled = true; err.textContent = "Consegna in corso…";
    var r = buildAnswers();
    var invio;
    try {
      invio = window.Addestramento ? Promise.resolve(window.Addestramento.completa(r.list, r.score)).catch(function () { return false; }) : Promise.resolve(false);
    } catch (e) { invio = Promise.resolve(false); }
    invio.then(function (ok) {
      // un solo nuovo tentativo; alla seconda volta si prosegue comunque, con avviso
      if (ok === false && window.Addestramento && ++tentativi < 2) {
        sending = false; btn.disabled = false; btn.textContent = "Consegna (riprova)";
        err.textContent = "Invio non riuscito: controlla la connessione e riprova.";
        return;
      }
      S.sub = true; S.ok = (ok !== false); persist(); sending = false; render();
    });
  }

  // ── correzione
  function esito(good, tua) {
    var m = el("div", "res " + (good ? "ok" : "ko"));
    add(m, el("span", "lbl", good ? "Corretto — " : "Non corretto — "), document.createTextNode("la tua risposta: " + tua));
    return m;
  }
  function giusta(text) { var g = el("div", "res ok"); add(g, el("span", "lbl", "Risposta giusta: "), document.createTextNode(text)); return g; }
  function cardChiusa(titolo, fonteTxt, k, opts, okFn, giustaTxt, why) {
    var d = el("div", "card");
    d.appendChild(el("h3", null, titolo));
    if (fonteTxt) d.appendChild(fonte(fonteTxt, "frase"));
    var good = k != null && okFn(k);
    d.appendChild(esito(good, k == null ? "(nessuna)" : opts[k]));
    if (!good) d.appendChild(giusta(giustaTxt));
    d.appendChild(el("p", null, why));
    return d;
  }
  function cardAperta(titolo, q) {
    var d = el("div", "card");
    d.appendChild(el("h3", null, titolo));
    d.appendChild(el("div", "lbl", "La tua risposta"));
    d.appendChild(el("div", "mine", (S.tx[q.id] || "").trim() || "(nessuna)"));
    var m = el("div", "model");
    m.appendChild(el("div", "lbl", "Modello di risposta"));
    m.appendChild(el("div", null, q.intro));
    var ul = el("ul"); q.punti.forEach(function (t) { ul.appendChild(el("li", null, t)); }); m.appendChild(ul);
    d.appendChild(m);
    d.appendChild(el("p", "note", "Confronta: che cosa avevi già scritto? Che cosa ti è sfuggito?"));
    return d;
  }
  function cardApprofondimento(a) {
    var d = el("div", "card");
    d.appendChild(el("h3", null, a.titolo));
    a.testo.forEach(function (t) { d.appendChild(el("p", null, t)); });
    return d;
  }
  function parte(titolo) { var p = el("div", "part"); p.appendChild(el("h2", null, titolo)); return p; }

  function renderCorrezione() {
    var r = buildAnswers();
    var c = el("div", "card");
    var h2 = el("h2", null, "Esercitazione consegnata"); h2.tabIndex = -1; c.appendChild(h2);
    c.appendChild(el("div", "score", r.right + " su " + r.tot + " risposte chiuse corrette"));
    c.appendChild(el("p", null, "Qui sotto trovi la correzione. Leggila con calma: serve a capire che cosa ti manca, non a prendere un voto. Per le risposte scritte non c'è un esito automatico: confrontale tu con il modello."));
    c.appendChild(el("p", S.ok === false ? "note warn" : "note", S.ok === false ? "Attenzione: il risultato NON è stato registrato (connessione assente o bloccata). Avvisa il docente." : "Risultato registrato."));
    app.appendChild(c);

    // Parte 1
    app.appendChild(parte(D.p1.titolo));
    D.p1.mc.forEach(function (q, i) {
      app.appendChild(cardChiusa((i + 1) + ". " + q.prompt, null, S.mc[q.id], q.opts, function (k) { return k === q.ok; }, q.opts[q.ok], q.why));
    });
    var br = el("div", "card"); add(br, el("h3", null, D.p1.bTitolo), fonte(D.p1.brano), el("p", "dida", D.p1.didascalia)); app.appendChild(br);
    D.p1.classifica.forEach(function (f, i) {
      app.appendChild(cardChiusa("3. Frase " + "abcd".charAt(i) + ": descrive o valuta?", f.testo, S.mc[f.id], D.p1.classOpzioni, function (k) { return k === f.ok; }, D.p1.classOpzioni[f.ok], f.why));
    });
    app.appendChild(cardAperta("4. " + D.p1.aperta.prompt, D.p1.aperta));
    app.appendChild(cardApprofondimento(D.p1.approfondimento));

    // Parte 2
    app.appendChild(parte(D.p2.titolo));
    var dp = el("div", "card"); dp.appendChild(figura(IMG_DIPINTO, D.p2.alt, D.p2.didascalia)); app.appendChild(dp);
    D.p2.aperte.forEach(function (q, i) { app.appendChild(cardAperta((i + 1) + ". " + q.prompt, q)); });
    app.appendChild(cardApprofondimento(D.p2.approfondimento));

    // Parte 3
    app.appendChild(parte(D.p3.titolo));
    var sl = el("div", "card"); sl.appendChild(slide()); app.appendChild(sl);
    D.p3.collegamenti.forEach(function (cg, i) {
      var okTxt = cg.nodo.ok.map(function (j) { return "«" + D.p3.nodi[j] + "»"; }).join(" oppure ");
      app.appendChild(cardChiusa((i + 1) + ". " + cg.nodo.prompt, null, S.mc[cg.nodo.id], D.p3.nodi, function (k) { return cg.nodo.ok.indexOf(k) !== -1; }, okTxt, cg.nodo.why));
      app.appendChild(cardAperta(cg.motivazione.prompt, cg.motivazione));
    });
    app.appendChild(cardAperta("3. " + D.p3.finale.prompt, D.p3.finale));

    var fine = el("div", "card"); fine.appendChild(el("p", null, D.chiusura));
    if (S.ok === false) fine.appendChild(el("p", "note warn", "Ricorda: il risultato NON è stato registrato. Avvisa il docente."));
    app.appendChild(fine);
    window.scrollTo(0, 0);
    try { h2.focus({ preventScroll: true }); } catch (e) { h2.focus(); }
  }

  // Se l'adattatore non si carica, l'esercitazione funziona lo stesso (senza registrazione).
  function avvia() {
    app = document.getElementById("app");
    if (!window.Addestramento) { render(); return; }
    try {
      window.Addestramento.start({
        labId: LAB_ID,
        title: D.titolo,
        salvaRisposte: true,              // decisione esplicita: il docente legge le risposte finali
        tempoAtteso: D.tempoAtteso,       // secondi per uno studente concentrato
        caratteriAttesi: D.caratteriAttesi, // caratteri complessivi nelle risposte aperte
        onReady: function () { app = document.getElementById("app"); render(); }
      });
    } catch (e) { render(); }
  }
  avvia();
})();
</script>
</body>
</html>
