  var D = {"labId":"storia_acciaio_nuovi_leader","titolo":"L’acciaio e i nuovi leader","tipologiaEtichetta":"Analizzare testi","richiamo":{"titolo":"Prima di cominciare","testo":["Sai già che cosa è stata la prima rivoluzione industriale: il cotone, il ferro, il carbone, la macchina a vapore, la Gran Bretagna in testa. Oggi guardi due fonti della seconda metà dell’Ottocento: una tabella e una fotografia. La lezione che segue partirà dalle tue risposte.","Lavori da solo. Hai circa 25 minuti: 8 per la tabella, 8 per la fotografia, 4 per l’ultima domanda. Alla fine consegni e vedi la correzione."]},"parti":[{"titolo":"Parte 1 — Quanto acciaio","meta":"Guida media · 8 minuti","contesto":["Nella seconda metà dell’Ottocento si impara a produrre acciaio in grandi quantità con nuovi procedimenti, come il convertitore Bessemer. L’acciaio è più resistente del ferro e serve per rotaie, navi, macchine e armi.","La tabella riporta quanto acciaio producono tre paesi in tre anni diversi. Leggila con attenzione prima di rispondere."],"fonte":{"tipo":"tabella","intestazione":["Anno","Gran Bretagna","Germania","Stati Uniti"],"righe":[["1880","1,3","0,8","1,3"],["1890","3,6","2,2","4,3"],["1900","5,0","6,6","10,4"]],"didascalia":"Produzione di acciaio, in milioni di tonnellate (cifre arrotondate). Elaborazione da NBER Macrohistory Database; per la Germania i dati comprendono il Lussemburgo."},"domande":[{"tipo":"mc","id":"p1_q1","prompt":"Chi è in testa nel 1880, nel 1890 e nel 1900?","opts":["1880 Gran Bretagna; 1890 Gran Bretagna; 1900 Germania, di poco davanti agli Stati Uniti","1880 Gran Bretagna; 1890 Stati Uniti; 1900 Germania e Stati Uniti più o meno alla pari","1880 Stati Uniti; 1890 Germania; 1900 Stati Uniti e Gran Bretagna più o meno alla pari","1880 Gran Bretagna e Stati Uniti alla pari; 1890 Stati Uniti; 1900 Stati Uniti"],"ok":3,"why":"Nel 1880 Gran Bretagna e Stati Uniti sono alla pari, con 1,3 milioni di tonnellate ciascuno. Nel 1890 gli Stati Uniti sono già davanti (4,3 contro 3,6). Nel 1900 lo sono di molto (10,4): la Germania (6,6) è seconda e ha superato a sua volta la Gran Bretagna (5,0). I sorpassi sono due, in due momenti diversi: gli Stati Uniti sulla Gran Bretagna tra il 1880 e il 1890, la Germania sulla Gran Bretagna tra il 1890 e il 1900."},{"tipo":"mc","id":"p1_q2","prompt":"Fra il 1880 e il 1900, quale paese aumenta di più la sua produzione, contando i milioni di tonnellate in più?","opts":["La Gran Bretagna, che nel 1880 parte da una produzione già alta","La Germania, che nel 1880 parte dalla produzione più bassa dei tre","Gli Stati Uniti, che nel 1880 sono alla pari con gli inglesi","Tutti e tre i paesi aumentano più o meno della stessa quantità di acciaio"],"ok":2,"why":"Basta fare le sottrazioni: gli Stati Uniti passano da 1,3 a 10,4 (circa 9 milioni di tonnellate in più), la Germania da 0,8 a 6,6 (quasi 6 in più), la Gran Bretagna da 1,3 a 5,0 (meno di 4 in più)."},{"tipo":"mc","id":"p1_q3","prompt":"Ora guarda solo il 1890 e il 1900. Quale paese cresce di più in proporzione, cioè moltiplica di più la sua produzione?","opts":["La Gran Bretagna, che resta il paese con più esperienza industriale","La Germania, che in dieci anni moltiplica la produzione","Gli Stati Uniti, che nel 1900 producono più di tutti gli altri","Nessuno dei tre: le proporzioni sono più o meno le stesse per tutti"],"ok":1,"why":"Qui serve la divisione, non la sottrazione. La Germania passa da 2,2 a 6,6: la produzione triplica (×3). Gli Stati Uniti passano da 4,3 a 10,4 (circa ×2,4), la Gran Bretagna da 3,6 a 5,0 (circa ×1,4). Gli Stati Uniti aggiungono più tonnellate, la Germania cresce più in fretta: sono due misure diverse della crescita, e danno due risposte diverse."},{"tipo":"aperta","id":"p1_q4","prompt":"Che cosa puoi dedurre da questa tabella? Scrivi due o tre cose.","righe":4,"intro":"Una buona risposta contiene almeno due di questi punti, con i dati che li sostengono:","punti":["il primato cambia di mano: gli Stati Uniti superano la Gran Bretagna prima del 1890, la Germania la supera prima del 1900","la Gran Bretagna perde il primato, ma non la produzione: nel 1900 produce quasi quattro volte l’acciaio del 1880. Non è un declino, è un sorpasso","la produzione cresce in tutti e tre i paesi, e cresce più in fretta dopo il 1890","un limite: la tabella dice che cosa è successo, non perché; e riguarda solo tre paesi e solo l’acciaio"]}],"approfondimento":{"titolo":"Che cosa c’è intorno alla tabella","testo":["Nella seconda metà dell’Ottocento cambia il re dei metalli: dal ferro all’acciaio, prodotto in grande quantità con il convertitore Bessemer (1856) e poi con il forno Siemens-Martin. L’acciaio diventa uno degli indicatori più usati della forza industriale di un paese.","La Gran Bretagna, che aveva aperto la rivoluzione industriale, viene raggiunta e superata da paesi arrivati dopo. Ma attenzione a non trasformare la tabella in un racconto di declino: la produzione britannica continua a crescere, e la Gran Bretagna resta a lungo il primo paese per commercio, flotta mercantile, finanza e colonie. L’acciaio è un indicatore importante, non l’unico."]}},{"titolo":"Parte 2 — Le officine Krupp","meta":"Guida media · 8 minuti","contesto":["Krupp è un’impresa di famiglia di Essen, nella regione della Ruhr, in Germania. Produce acciaio e, sempre di più, cannoni. La fotografia è degli anni Sessanta dell’Ottocento.","Guarda la fotografia con calma prima di rispondere."],"fonte":{"tipo":"img","file":"krupp","alt":"Fotografia in bianco e nero, presa dall’alto. In primo piano tetti spioventi di capannoni; a sinistra un edificio bianco a più piani. Sullo sfondo, fino all’orizzonte, una distesa di tettoie e moltissime ciminiere alte e sottili, alcune fumanti. In basso a sinistra un cortile affollato di persone, carri e grossi pezzi di metallo cilindrici.","didascalia":"Le officine Krupp a Essen, fotografia degli anni Sessanta dell’Ottocento."},"domande":[{"tipo":"aperta","id":"p2_q1","prompt":"Prima di tutto, guarda. Descrivi due cose che vedi nella fotografia.","righe":3,"intro":"Una buona risposta descrive, senza ancora interpretare. Per esempio:","punti":["moltissime ciminiere, alte e sottili, alcune che fumano","una distesa di capannoni e tettoie che arriva fino all’orizzonte","un cortile affollato di persone, carri e grossi pezzi di metallo","un edificio bianco a più piani, diverso dai capannoni: forse uffici o abitazioni","la foto è presa dall’alto: si vede la fabbrica intera, non il lavoro da vicino"]},{"tipo":"mc","id":"p2_q2","prompt":"Chi può aver fatto fare una fotografia come questa, in quegli anni?","opts":["La stessa ditta Krupp, per mostrare la sua fabbrica a clienti e visitatori","Un giornale operaio, per denunciare le condizioni di lavoro nelle acciaierie","Un ispettore del governo, per controllare che la fabbrica rispettasse le leggi","Un turista di passaggio, curioso di vedere da vicino una grande fabbrica tedesca"],"ok":0,"why":"Negli anni Sessanta dell’Ottocento una fotografia di questo tipo richiede attrezzature costose, tempo e il permesso di salire sui tetti della fabbrica. Krupp aveva studi fotografici propri e usava la fotografia per farsi conoscere: le foto della fabbrica andavano a clienti, governi e alle esposizioni internazionali. Un giornale operaio avrebbe mostrato altro: il lavoro, la fatica, le persone da vicino."},{"tipo":"aperta","id":"p2_q3","prompt":"Questa fotografia ti informa o vuole impressionarti? Indica un elemento della foto che te lo fa pensare (che cosa mostra, da dove è scattata, che cosa non mostra).","righe":4,"intro":"Una buona risposta contiene almeno i primi due punti:","punti":["una scelta chiara, oppure «tutte e due», purché motivata","un elemento preciso: la foto dall’alto mostra quanto è grande la fabbrica; la distesa di ciminiere; il cortile pieno di attività; il fatto che non si vede nessuno lavorare da vicino","chi risponde «tutte e due» ha colto il punto: la foto informa davvero (com’era fatta la fabbrica), ma ha scelto di mostrarne soprattutto la grandezza","in più: chi l’ha fatta fare era Krupp stesso, quindi l’intenzione di impressionare è probabile"]}],"approfondimento":{"titolo":"Che cosa c’è intorno alla fotografia","testo":["Krupp fu tra i primi industriali a capire che cosa poteva fare la fotografia per un’impresa. Aveva studi fotografici propri e usava le foto per farsi conoscere e per documentare la crescita della fabbrica. Per l’Esposizione universale di Parigi del 1867 fece riprendere la fabbrica in un grande panorama, scattato dalla torre di un’officina: da lassù si vedeva quanto era grande l’impianto.","Come voleva quelle fotografie? In una lettera del gennaio 1867 Krupp chiede di scattarle in maggio, quando tutto è verde e non c’è vento, e di domenica, per non avere il fumo dei giorni di lavoro. Aggiunge però che sarebbe bello se un po’ di vapore uscisse da più punti possibile: la fabbrica doveva sembrare viva, ma pulita. Non sappiamo se la foto che hai visto sia stata fatta così. Sappiamo però come Krupp voleva che la sua fabbrica fosse vista.","Documentare e celebrare, qui, non si escludono: la foto mostra davvero com’era la fabbrica, ma l’ha scelta, inquadrata e fatta fare chi voleva venderne l’immagine."]}},{"titolo":"Parte 3 — Che cosa cambia","meta":"Guida media · 4 minuti","contesto":["Pensa a quello che sai già sulla prima rivoluzione industriale, anche dalle fonti che hai analizzato nei laboratori precedenti. Poi guarda di nuovo la tabella e la fotografia."],"fonte":null,"domande":[{"tipo":"aperta","id":"p3_q1","prompt":"Che cosa ti sembra cambiato rispetto alla prima rivoluzione industriale? Prova a indicare due o tre cambiamenti.","righe":5,"intro":"Non c’è una sola risposta giusta: la lezione verificherà le tue ipotesi. Cambiamenti che si possono ricavare dalle due fonti:","punti":["il materiale: dal ferro all’acciaio; e dal cotone dell’industria tessile alla siderurgia","i paesi: la Gran Bretagna non è più sola in testa; Stati Uniti e Germania c         var f = mancanti[0].node._focus; if (f) f.focus();
        return;
      }
      if (S.step < ULTIMO) { S.step++; persist(); render(); } else consegna(next, err);
    };
    function pulisci(ev) { if (ev.target !== next && err.textContent) err.textContent = ""; }
    c.addEventListener("input", pulisci); c.addEventListener("click", pulisci);
    app.appendChild(c);
    window.scrollTo(0, 0);
    try { h2.focus({ preventScroll: true }); } catch (e) { h2.focus(); }
  }

  function renderAvvio() {
    var c = el("div", "card");
    var h2 = el("h2", null, D.richiamo.titolo); h2.tabIndex = -1; c.appendChild(h2);
    D.richiamo.testo.forEach(function (t) { c.appendChild(el("p", null, t)); });
    var b = el("button", "btn", "Comincia"); b.type = "button";
    b.onclick = function () { S.step = 1; persist(); render(); };
    var row = el("div", "row"); add(row, el("span"), b); c.appendChild(row);
    app.appendChild(c);
    window.scrollTo(0, 0);
  }

  function buildAnswers() {
    var list = [], right = 0, tot = 0;
    D.parti.forEach(function (P) {
      P.domande.forEach(function (q) {
        if (q.tipo === "mc") {
          tot++;
          var k = S.mc[q.id]; if (k == null) return;
          var good = k === q.ok; if (good) right++;
          list.push({ id: q.id, prompt: q.prompt, type: "mc", answer: q.opts[k], correct: good });
        } else {
          var t = (S.tx[q.id] || "").trim(); if (!t) return;
          list.push({ id: q.id, prompt: q.prompt, type: "essay", answer: t.slice(0, 4000), correct: null });
        }
      });
    });
    return { list: list, right: right, tot: tot, score: tot ? Math.round(right / tot * 100) : null };
  }

  var sending = false, tentativi = 0;
  function consegna(btn, err) {
    if (sending) return; sending = true; btn.disabled = true; err.textContent = "Consegna in corso…";
    var r = buildAnswers(), invio;
    try { invio = window.Addestramento ? Promise.resolve(window.Addestramento.completa(r.list, r.score)).catch(function () { return false; }) : Promise.resolve(false); }
    catch (e) { invio = Promise.resolve(false); }
    invio.then(function (ok) {
      if (ok === false && window.Addestramento && ++tentativi < 2) {
        sending = false; btn.disabled = false; btn.textContent = "Consegna (riprova)";
        err.textContent = "Invio non riuscito: controlla la connessione e riprova.";
        return;
      }
      S.sub = true; S.ok = (ok !== false); persist(); sending = false; render();
    });
  }

  function esito(good, tua) { var m = el("div", "res " + (good ? "ok" : "ko")); add(m, el("span", "lbl", good ? "Corretto — " : "Non corretto — "), document.createTextNode("la tua risposta: " + tua)); return m; }
  function giusta(text) { var g = el("div", "res ok"); add(g, el("span", "lbl", "Risposta giusta: "), document.createTextNode(text)); return g; }
  function cardChiusa(titolo, q) {
    var d = el("div", "card"), k = S.mc[q.id], good = k === q.ok;
    d.appendChild(el("h3", null, titolo));
    d.appendChild(esito(good, k == null ? "(nessuna)" : q.opts[k]));
    if (!good) d.appendChild(giusta(q.opts[q.ok]));
    d.appendChild(el("p", null, q.why));
    return d;
  }
  function cardAperta(titolo, q) {
    var d = el("div", "card");
    d.appendChild(el("h3", null, titolo));
    d.appendChild(el("div", "lbl", "La tua risposta"));
    d.appendChild(el("div", "mine", (S.tx[q.id] || "").trim() || "(nessuna)"));
    var m = el("div", "model");
    m.appendChild(el("div", "lbl", "Modello di risposta"));
    m.appendChild(el("div", null, q.intro));
    var ul = el("ul"); q.punti.forEach(function (t) { ul.appendChild(el("li", null, t)); }); m.appendChild(ul);
    d.appendChild(m);
    d.appendChild(el("p", "note", "Confronta: che cosa avevi già scritto? Che cosa ti è sfuggito?"));
    return d;
  }
  function cardApprofondimento(a) { var d = el("div", "card"); d.appendChild(el("h3", null, a.titolo)); a.testo.forEach(function (t) { d.appendChild(el("p", null, t)); }); return d; }
  function parte(titolo) { var p = el("div", "part"); p.appendChild(el("h2", null, titolo)); return p; }

  function renderCorrezione() {
    var r = buildAnswers();
    var c = el("div", "card");
    var h2 = el("h2", null, "Esercitazione consegnata"); h2.tabIndex = -1; c.appendChild(h2);
    c.appendChild(el("div", "score", r.right + " su " + r.tot + " risposte chiuse corrette"));
    c.appendChild(el("p", null, "Qui sotto trovi la correzione. Leggila con calma: serve a capire che cosa ti manca, non a prendere un voto. Per le risposte scritte non c'è un esito automatico: confrontale tu con il modello."));
    c.appendChild(el("p", S.ok === false ? "note warn" : "note", S.ok === false ? "Attenzione: il risultato NON è stato registrato (connessione assente o bloccata). Avvisa il docente." : "Risultato registrato."));
    app.appendChild(c);
    D.parti.forEach(function (P) {
      app.appendChild(parte(P.titolo));
      var fo = fonteDi(P); if (fo) { var fc = el("div", "card"); fc.appendChild(fo); app.appendChild(fc); }
      P.domande.forEach(function (q, k) {
        var t = (k + 1) + ". " + q.prompt;
        app.appendChild(q.tipo === "mc" ? cardChiusa(t, q) : cardAperta(t, q));
      });
      if (P.approfondimento) app.appendChild(cardApprofondimento(P.approfondimento));
    });
    var fine = el("div", "card"); fine.appendChild(el("p", null, D.chiusura));
    if (S.ok === false) fine.appendChild(el("p", "note warn", "Ricorda: il risultato NON è stato registrato. Avvisa il docente."));
    app.appendChild(fine);
    window.scrollTo(0, 0);
    try { h2.focus({ preventScroll: true }); } catch (e) { h2.focus(); }
  }

  function avvia() {
    app = document.getElementById("app");
    if (!window.Addestramento) { render(); return; }
    try {
      window.Addestramento.start({
        labId: LAB_ID,
        title: D.titolo,
        salvaRisposte: true,                 // decisione esplicita: il docente legge le risposte finali
        tempoAtteso: D.tempoAtteso,          // secondi per uno studente concentrato
        caratteriAttesi: D.caratteriAttesi,  // caratteri complessivi nelle risposte aperte
        onReady: function () { app = document.getElementById("app"); render(); }
      });
    } catch (e) { render(); }
  }
  avvia();
})();
</script>
