.fb p{margin:4px 0 0}

.count{font-size:.85rem;color:var(--muted);text-align:right;margin:4px 0 10px}
.notice{border:1px dashed var(--muted);border-radius:10px;padding:8px 12px;font-size:.9rem;color:var(--muted);margin:0 0 12px}

.rev{border-top:1px solid var(--line);padding:10px 0}

.seg.m-cert{background:var(--cert);color:var(--cert-ink)}
.seg.bad{text-decoration:underline wavy var(--ko);text-underline-offset:4px}

ul.order .pos{font-weight:600;color:var(--muted);width:1.4em;text-align:center}

table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-weight:600;background:var(--quote);font-size:.82rem}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}

var KEY = "addestr_state_" + L.labId;
var TIP = "Analizzare testi";
var SECS = L.sections;
var S = load() || { i:0, a:{}, done:false };
if (!S.a) S.a = {};
var app = document.getElementById("app");
var registered = true;
var PEN = "peso";

function load(){ try { var v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function header(){
  var h = el("header");
  h.appendChild(el("p","eyebrow",L.eyebrow));

  h.appendChild(el("span","chip",TIP));

  p.setAttribute("aria-valuemin","0"); p.setAttribute("aria-valuemax","100"); p.setAttribute("aria-valuenow", pct);
  h.appendChild(p);

// ---------- brani ----------
function passageBlock(pid){
  var P = PASSI[pid];
  if (P.table){
    var d = el("div");
    d.appendChild(el("p","fase",P.src));
    var w = el("div","tbl"), t = el("table"), th = el("thead"), tr = el("tr");
    P.table.head.forEach(function(x){ tr.appendChild(el("th",null,x)); }); th.appendChild(tr); t.appendChild(th);
    var tb = el("tbody");
    P.table.rows.forEach(function(r){ var row = el("tr"); r.forEach(function(x,k){ row.appendChild(el("td", k ? "num" : null, x)); }); tb.appendChild(row); });
    t.appendChild(tb); w.appendChild(t); d.appendChild(w);
    return d;
  }
  var q = el("div","passo"); q.appendChild(el("span","src",P.src)); q.appendChild(document.createTextNode(P.text));

}
function rereadBox(pid){
  var d = el("details"); d.appendChild(el("summary",null, PASSI[pid].table ? "Rivedi i dati" : "Rileggi il testo"));
  var i = el("div","inner"); i.appendChild(passageBlock(pid)); d.appendChild(i); return d;
}

// ---------- evidenziatore (esercizio 1a) ----------
function hlEval(){
  var marks = S.a.hl_marks || {}, r = { fp:0, fc:0, TP:0, TC:0, wrong:0, ordine:false, altro:false };
  HL.forEach(function(sg,i){
    var k = sg[1], m = marks[i];
    if (k==="peso"){ r.TP++; if (m==="peso") r.fp++; }
    if (k==="cert"){ r.TC++; if (m==="cert") r.fc++; }
    if (!m || k==="libero") return;
    if (k==="ordine"){ r.wrong++; r.ordine = true; return; }
    if (k!==m){ r.wrong++; r.altro = true; }
  });
  return r;
}
function hlPassage(live, onChange){
  var marks = S.a.hl_marks || {}, done = !!S.a.hl_done;
  var box = el("div","passo"); box.appendChild(el("span","src",PASSI.castiglia.src));
  HL.forEach(function(sg,i){
    var sp = el("span","seg",sg[0]);
    if (marks[i]) sp.classList.add("m-"+marks[i]);
    if (done){
      var k = sg[1], m = marks[i];
      if (m && k!=="libero" && k!==m) sp.classList.add("bad");
      if ((k==="peso"||k==="cert") && m!==k) sp.classList.add("miss");
    }
    if (live){
      sp.classList.add("live"); sp.tabIndex = 0; sp.setAttribute("role","button");
      var tog = function(){
        var mk = S.a.hl_marks = S.a.hl_marks || {};
        if (mk[i]===PEN){ delete mk[i]; sp.classList.remove("m-"+PEN); }
        else { if (mk[i]) sp.classList.remove("m-"+mk[i]); mk[i] = PEN; sp.classList.add("m-"+PEN); }
        sp.setAttribute("aria-pressed", mk[i] ? "true" : "false");
        persist(); onChange();
      };
      sp.setAttribute("aria-pressed", marks[i] ? "true" : "false");
      sp.addEventListener("click", tog);
      sp.addEventListener("keydown", function(e){ if (e.key==="Enter"||e.key===" "){ e.preventDefault(); tog(); } });
    }
    box.appendChild(sp);
  });
  return box;
}
function hlFeedback(){
  var r = hlEval(), all = (r.fp===r.TP && r.fc===r.TC && !r.wrong);
  var f = el("div","fb "+(all ? "ok" : (r.fp+r.fc>=5 ? "mid" : "ko"))); f.setAttribute("role","status");
  f.appendChild(el("b",null,"Peso: "+r.fp+" su "+r.TP+" · Certezza: "+r.fc+" su "+r.TC));
  if (r.ordine) f.appendChild(el("p",null,"«Anzitutto», «in secondo luogo», «infine» ordinano l’elenco, non dicono quale effetto conta di più: sono sottolineati con l’onda."));
  if (r.altro) f.appendChild(el("p",null,"Alcuni segni sono su espressioni che non indicano né peso né certezza, o sono del colore sbagliato: guarda quelle sottolineate con l’onda."));
  if (r.fp<r.TP) f.appendChild(el("p",null,"Le parole che collocano una causa o un effetto su una scala: secondario, più importante, decisivo."));
  if (r.fc<r.TC) f.appendChild(el("p",null,"Le parole che dicono quanto l’autore è sicuro: ce ne sono di prudenti e di sicure."));
  if (r.fp<r.TP || r.fc<r.TC) f.appendChild(el("p",null,"Le espressioni che dovevi evidenziare e non hai segnato (o hai segnato con il colore sbagliato) sono riquadrate con il tratteggio."));
  return f;
}
function renderHighlight(card, s, refresh){
  card.appendChild(el("p",null,s.intro));
  var done = !!S.a.hl_done, vb = null;
  if (!done){
    var pens = el("div","pens"); pens.setAttribute("role","group"); pens.setAttribute("aria-label","Evidenziatore");
    [["peso","Peso delle cause"],["cert","Grado di certezza"]].forEach(function(p){
      var b = el("button","pen"); b.type="button"; b.setAttribute("aria-pressed", PEN===p[0] ? "true" : "false");
      var sw = el("span","sw "+p[0]); b.appendChild(sw); b.appendChild(document.createTextNode(p[1]));
      b.onclick = function(){ PEN = p[0]; Array.prototype.forEach.call(pens.children, function(x){ x.setAttribute("aria-pressed", x===b ? "true" : "false"); }); };
      pens.appendChild(b);
    });
    card.appendChild(pens);
  }
  var upd = function(){ if (vb) vb.disabled = !Object.keys(S.a.hl_marks||{}).length; refresh(); };
  card.appendChild(hlPassage(!done, upd));
  if (!done){
    vb = el("button","btn","Verifica le evidenziazioni"); vb.type="button";
    vb.disabled = !Object.keys(S.a.hl_marks||{}).length;
    vb.onclick = function(){ S.a.hl_done = true; persist(); render("hl"); };
    var row = el("div","nav"); row.appendChild(vb); card.appendChild(row);
  } else {
    var f = hlFeedback(); f.id = "it_hl"; card.appendChild(f);
  }
}

// ---------- ordinamento (esercizio 2) ----------
function orderOf(s){
  var o = S.a["ord_"+s.id];
  return (o && o.length===s.right.length && o.every(function(k){ return s.cards[k]; })) ? o : s.initial.slice();
}
function renderOrder(card, s){
  card.appendChild(el("p",null,s.intro));
  var ord = orderOf(s), done = !!S.a["ordv_"+s.id];
  var ul = el("ul","order");
  ord.forEach(function(k,i){
    var li = el("li"); li.appendChild(el("span","pos",String(i+1))); li.appendChild(el("span",null,s.cards[k]));
    if (done){ li.classList.add(ord[i]===s.right[i] ? "good" : "wrong"); }
    else {
      var mv = el("span","mv");
      var up = el("button",null,"↑"); up.type="button"; up.id="mv_"+s.id+"_"+k+"_u"; up.setAttribute("aria-label","Sposta su: "+s.cards[k]); up.disabled = i===0;
      var dn = el("button",null,"↓"); dn.type="button"; dn.id="mv_"+s.id+"_"+k+"_d"; dn.setAttribute("aria-label","Sposta giù: "+s.cards[k]); dn.disabled = i===ord.length-1;
      up.onclick = function(){ var t=ord[i-1]; ord[i-1]=ord[i]; ord[i]=t; S.a["ord_"+s.id]=ord; persist(); render(null, up.disabled ? null : (i-1===0 ? dn.id : up.id)); };
      dn.onclick = function(){ var t=ord[i+1]; ord[i+1]=ord[i]; ord[i]=t; S.a["ord_"+s.id]=ord; persist(); render(null, i+1===ord.length-1 ? up.id : dn.id); };
      mv.appendChild(up); mv.appendChild(dn); li.appendChild(mv);
    }
    ul.appendChild(li);
  });
  card.appendChild(ul);
  if (!done){
    var vb = el("button","btn","Verifica l'ordine"); vb.type="button";
    vb.onclick = function(){ S.a["ord_"+s.id] = ord; S.a["ordv_"+s.id] = true; persist(); render(s.id); };
    var row = el("div","nav"); row.appendChild(vb); card.appendChild(row);
  } else {
    var n = ord.filter(function(k,i){ return k===s.right[i]; }).length, N = s.right.length;
    var f = el("div","fb "+(n===N ? "ok" : (n>=3 ? "mid" : "ko"))); f.setAttribute("role","status"); f.id = "it_"+s.id;
    f.appendChild(el("b",null,n+" schede su "+N+" al posto giusto."));
    f.appendChild(el("p",null,"La catena: "+s.sol));
    card.appendChild(f);
  }
}

// ---------- scelte (classificazioni e domande a risposta chiusa) ----------
function renderChoiceItem(card, it, prompt, labels, quote){
  var box = el("div","item");
  box.appendChild(el("p", quote ? "q quote" : "q", prompt));
  var chosen = S.a[it.id];
  labels.forEach(function(lab,k){
    var b = el("button","opt",lab); b.type="button";
    b.setAttribute("aria-pressed", chosen===k ? "true":"false");
    if (chosen !== undefined){ b.disabled = true; if (k===it.correct) b.classList.add("right"); else if (k===chosen) b.classList.add("wrong"); }
    b.onclick = function(){ if (S.a[it.id]!==undefined) return; S.a[it.id]=k; persist(); render(it.id); };
    box.appendChild(b);
  });
  if (chosen !== undefined){
    var ok = chosen===it.correct;
    var fb = el("div","fb "+(ok?"ok":"ko")); fb.setAttribute("role","status");
    fb.appendChild(el("b",null, ok ? "Giusto." : "Non proprio: la risposta è «"+labels[it.correct]+"»."));
    if (it.whys){
      if (!ok) fb.appendChild(el("p",null,"La tua: "+it.whys[chosen]));
      fb.appendChild(el("p",null,(ok ? "" : "Quella giusta: ")+it.whys[it.correct]));
    } else fb.appendChild(document.createTextNode(it.spieg));
    box.appendChild(fb);
  }
  box.id = "it_"+it.id;
  card.appendChild(box);
}
function labelsOf(s, it){ return it.options || s.categories; }

// ---------- risposte aperte ----------
function essayOk(s){ return s.items.every(function(it){ return (S.a[it.id]||"").trim().length >= s.min; }); }

function sectionComplete(s){
  if (s.kind==="choice") return s.items.every(function(it){ return S.a[it.id]!==undefined; });
  if (s.kind==="highlight") return !!S.a.hl_done;
  if (s.kind==="order") return !!S.a["ordv_"+s.id];
  if (s.kind==="essay") return essayOk(s);
  return true;
}

function render(focusId, focusBtn){
  app.innerHTML = "";
  app.appendChild(header());
  if (!registered) app.appendChild(el("div","notice","Registro non raggiungibile: puoi svolgere comunque l'esercitazione."));
  if (S.done) return renderDone();
  var s = SECS[S.i];
  var nx = null;
  var refresh = function(){ if (nx) nx.disabled = !sectionComplete(s); };
  var card = el("section","card");
  if (s.fase) card.appendChild(el("p","fase",s.fase));
  card.appendChild(el("h2",null,s.title));
  if (s.skill) card.appendChild(el("p","skill",s.skill));

  if (s.kind==="info"){
    L.richiamo.paras.forEach(function(t){ card.appendChild(el("p",null,t)); });
  } else if (s.kind==="highlight"){
    renderHighlight(card, s, refresh);
  } else {
    if (s.passage) card.appendChild(s.passageOpen ? passageBlock(s.passage) : rereadBox(s.passage));
    if (s.kind==="order"){
      renderOrder(card, s);
    } else if (s.kind==="choice"){
      if (s.consegna) card.appendChild(el("p",null,s.consegna));
      var many = s.items.length > 1;
      s.items.forEach(function(it,n){ renderChoiceItem(card, it, (many ? (n+1)+". " : "")+it.text, labelsOf(s,it), s.quoteItems); });
    } else if (s.kind==="essay"){
      if (s.intro) card.appendChild(el("p",null,s.intro));
      s.items.forEach(function(it,n){
        var box = el("div","item");
        var lab = el("label", it.quote ? "q quote" : "q", (s.items.length>1 ? (n+1)+". " : "")+it.prompt); lab.setAttribute("for","ta_"+it.id); lab.style.display="block"; lab.style.marginBottom="8px";
        box.appendChild(lab);
        var t = el("textarea"); t.id="ta_"+it.id; t.maxLength=s.max; t.value=S.a[it.id]||"";
        var c = el("div","count");
        var upd = function(){ c.textContent = t.value.length+" / "+s.max+" caratteri" + (t.value.trim().length < s.min ? " · scrivi almeno "+s.min+" caratteri per proseguire" : ""); refresh(); };
        t.oninput = function(){ S.a[it.id]=t.value; persist(); upd(); };
        box.appendChild(t); box.appendChild(c); card.appendChild(box);
        upd();
      });
      card.appendChild(el("p","warn","Le soluzioni le vedi alla consegna, insieme alla correzione."));
    }
  }

  var nav = el("div","nav");
  if (S.i>0){ var bk = el("button","btn sec","Indietro"); bk.type="button"; bk.onclick=function(){ S.i--; persist(); render(); window.scrollTo(0,0); }; nav.appendChild(bk); }
  nav.appendChild(el("span","sp"));
  var last = S.i===SECS.length-1;
  nx = el("button","btn", last ? "Consegna" : "Avanti"); nx.type="button";
  nx.disabled = !sectionComplete(s);
  nx.onclick = function(){ if (!sectionComplete(s)) return; if (last) return consegna(); S.i++; persist(); render(); window.scrollTo(0,0); };
  nav.appendChild(nx);
  if (!sectionComplete(s) && (s.kind==="highlight" || s.kind==="order")) card.appendChild(el("div","notice","Per proseguire, premi prima «Verifica»."));
  card.appendChild(nav);
  app.appendChild(card);
  if (focusBtn){ var fbn = document.getElementById(focusBtn); if (fbn) fbn.focus({preventScroll:false}); }
  else if (focusId){ var f2 = document.getElementById("it_"+focusId); if (f2){ var b2 = f2.querySelector(".fb") || f2; b2.scrollIntoView({block:"nearest"}); } }
}

// ---------- consegna ----------
function answers(){
  var out = [];
  SECS.forEach(function(s){
    if (s.kind==="choice") s.items.forEach(function(it){ if (S.a[it.id]!==undefined) out.push({id:it.id, prompt:it.text.slice(0,300), type:"mc", answer:labelsOf(s,it)[S.a[it.id]], correct:S.a[it.id]===it.correct}); });
    if (s.kind==="highlight" && S.a.hl_done){
      var marks = S.a.hl_marks || {};
      HL.forEach(function(sg,i){
        var k = sg[1], m = marks[i];
        if (k==="peso"||k==="cert") out.push({id:"hl"+i, prompt:sg[0].trim().slice(0,300), type:"mc", answer:m||"", correct:m===k});
        else if (m && k!=="libero") out.push({id:"hl"+i, prompt:("Segno fuori posto: "+sg[0].trim()).slice(0,300), type:"mc", answer:m, correct:false});
      });
    }
    if (s.kind==="order" && S.a["ordv_"+s.id]){
      var ord = orderOf(s);
      ord.forEach(function(k,i){ out.push({id:s.id+"_"+(i+1), prompt:("Posizione "+(i+1)+" · "+s.title).slice(0,300), type:"mc", answer:s.cards[k], correct:k===s.right[i]}); });
    }
    if (s.kind==="essay") s.items.forEach(function(it){ if ((S.a[it.id]||"").trim()) out.push({id:it.id, prompt:it.prompt.slice(0,300), type:"essay", answer:String(S.a[it.id]).slice(0,4000), correct:null}); });
  });
  return out;
}
function score(){ var a = answers().filter(function(x){return x.type==="mc";}); if (!a.length) return null; return Math.round(100*a.filter(function(x){return x.correct;}).length/a.length); }

function consegna(){
  S.done = true; S.score = score(); persist();
  try { if (window.Addestramento && Addestramento.completa) Addestramento.completa(answers(), S.score); } catch(e){ registered = false; }
  render(); window.scrollTo(0,0);
}

function renderDone(){
  var card = el("section","card");
  card.appendChild(el("h2",null,"Consegnato: ecco la correzione"));
  var mcs = answers().filter(function(x){return x.type==="mc";});
  var ok = mcs.filter(function(x){return x.correct;}).length;
  card.appendChild(el("p","score","Risposte corrette nelle parti a correzione automatica: "+ok+" su "+mcs.length));
  SECS.forEach(function(s){
    if (s.kind==="info") return;
    var h = el("p","fase",(s.fase||"")+" · "+s.title); h.style.marginTop="14px"; card.appendChild(h);
    if (s.kind==="highlight"){
      var r0 = el("div","rev"); r0.appendChild(hlPassage(false)); r0.appendChild(hlFeedback()); card.appendChild(r0);
    } else if (s.kind==="order"){
      var ord = orderOf(s), r1 = el("div","rev"), ul = el("ul","order");
      ord.forEach(function(k,i){ var li = el("li", k===s.right[i] ? "good" : "wrong"); li.appendChild(el("span","pos",String(i+1))); li.appendChild(el("span",null,s.cards[k])); li.appendChild(el("span","tag "+(k===s.right[i]?"ok":"ko"), k===s.right[i] ? "✓" : "✗")); ul.appendChild(li); });
      r1.appendChild(ul); r1.appendChild(el("p",null,"La catena: "+s.sol)); card.appendChild(r1);
    } else if (s.kind==="choice"){
      s.items.forEach(function(it){
        var labels = labelsOf(s,it), mine = S.a[it.id], good = mine===it.correct;
        var r = el("div","rev");
        r.appendChild(el("p", s.quoteItems ? "q quote" : "q", it.text));
        var p = el("p"); p.appendChild(el("span","tag "+(good?"ok":"ko"), good?"✓ Giusto. ":"✗ Non proprio. "));
        p.appendChild(document.createTextNode("Tua risposta: «"+labels[mine]+"»"+(good?"":" · Risposta attesa: «"+labels[it.correct]+"»")));
        r.appendChild(p);
        r.appendChild(el("p",null, it.whys ? it.whys[it.correct] : it.spieg));
        card.appendChild(r);
      });
    } else if (s.kind==="essay"){
      s.items.forEach(function(it){
        var r2 = el("div","rev");
        r2.appendChild(el("p", it.quote ? "q quote" : "q", it.prompt));
        r2.appendChild(el("div","mine",S.a[it.id]||""));
        var sp = el("p"); sp.appendChild(el("span","tag",(s.solLabel||"Soluzione")+": ")); sp.appendChild(document.createTextNode(it.sol));
        r2.appendChild(sp);
        card.appendChild(r2);
      });
    }
  });
  var nav = el("div","nav"); nav.appendChild(el("span","sp"));
  var again = el("button","btn sec","Ricomincia da capo"); again.type="button";
  again.onclick = function(){ S = {i:0,a:{},done:false}; persist(); render(); window.scrollTo(0,0); };
  nav.appendChild(again); card.appendChild(nav);
  app.appendChild(card);
}

function start(){
  if (window.Addestramento && typeof Addestramento.start === "function"){
    try {
      Addestramento.start({ labId:L.labId, title:L.title, tempoAtteso:L.tempoAtteso, caratteriAttesi:L.caratteriAttesi, onReady:function(){ render(); } });
      return;
    } catch(e){}
  }
  registered = false; render();
}
start();
})();
</script>
</body>
