<script>
(function () {
  "use strict";
  var D = {"labId":"storia_conflitto_sociale_fonti","titolo":"Il conflitto sociale: due fonti e uno schema","tipologiaEtichetta":"Analizzare testi","richiamo":{"titolo":"Prima di cominciare","testo":["Sai già come si interroga una fonte: chi l’ha prodotta, quando, per chi e perché; che cosa mostra e che cosa vuole farti pensare. Oggi lo fai su due fonti che parlano del conflitto tra chi possiede le fabbriche e le miniere e chi ci lavora.","Lavori da solo. Hai circa 40 minuti: 13 per un elenco di multe, 12 per una vignetta, 10 per collegare le due fonti alla slide sul conflitto sociale. Alla fine consegni e vedi la correzione.","Se hai con te gli appunti della lezione, tienili aperti: nell’ultima parte ti servono."]},"parti":[{"chiave":"p1","titolo":"Parte 1 — Le multe di Tyldesley","meta":"Guida media · 13 minuti","contesto":["Tyldesley è un paese vicino a Manchester, nel cuore dell’industria del cotone. L’elenco che leggi viene da un opuscolo stampato a Manchester nel 1823, durante uno sciopero dei filatori.","Leggi l’elenco con attenzione, poi rispondi: prima due domande a scelta, poi due risposte brevi."],"fonte":{"tipo":"testo","intro":"«Gli operai, a Tyldesley, vicino a Manchester, lavorano a una temperatura di 80-84 gradi e sono soggetti alle seguenti multe:","voci":["il filatore trovato con la finestra aperta: 1 scellino","il filatore trovato sporco al lavoro: 1 scellino","il filatore trovato a lavarsi: 1 scellino","il filatore che ripara la cinghia del tamburo con il gas acceso: 2 scellini","il filatore che fila con il gas acceso troppo a lungo al mattino: 2 scellini","il filatore sentito fischiettare: 1 scellino.»"],"note":["I gradi sono Fahrenheit: 80-84 gradi corrispondono a circa 27-29 °C.","Il gas serviva a illuminare la filanda quando era buio. Il tamburo e la cinghia trasmettono il movimento alle macchine."],"didascalia":"Multe nella filanda di Tyldesley, da un opuscolo stampato a Manchester durante uno sciopero dei filatori, 1823. Traduzione di lavoro per uso didattico; qui ne leggi sei voci."},"mc":[{"id":"p1_q1","prompt":"Chi ha stabilito queste multe?","opts":["Gli stessi filatori, riuniti in assemblea per darsi regole di lavoro comuni","Il governo inglese, con una legge valida per tutte le filande del paese","Il proprietario della filanda, o chi la dirigeva per conto suo","I giudici di Manchester, dopo un processo contro gli operai in sciopero"],"ok":2,"why":"Le multe le decide chi comanda dentro la filanda: il proprietario o il direttore che lo rappresenta. Sono regole private, non leggi: nessun parlamento e nessun giudice le ha approvate, e gli operai non le hanno discusse. Il proprietario stabilisce la regola, controlla e incassa la multa."},{"id":"p1_q2","prompt":"L’elenco ci è arrivato perché fu stampato in un opuscolo durante uno sciopero. Chi aveva interesse a farlo conoscere?","opts":["Il proprietario, per far sapere a tutti che nella sua filanda regnava l’ordine","Gli operai in sciopero, per mostrare al pubblico a che cosa erano sottoposti","Il governo, per dare un modello di regolamento da imitare nelle altre filande","Un viaggiatore straniero, curioso di descrivere le fabbriche inglesi del tempo"],"ok":1,"why":"Le regole sono del proprietario, ma l’elenco arriva a noi attraverso i suoi avversari: gli scioperanti lo stampano per denunciare quelle multe. È una differenza importante. Chi ha pubblicato l’elenco ha scelto quali voci mettere e come presentarle, per ottenere l’appoggio del pubblico. Le multe sono probabilmente vere, ma la selezione è di parte."}],"aperte":[{"id":"p1_q3","prompt":"Scegli una multa. Quale comportamento vuole ottenere? E quale idea del tempo, o del corpo, dell’operaio rivela?","righe":4,"intro":"Una buona risposta contiene almeno i primi tre punti:","punti":["una multa precisa, citata o indicata chiaramente (non «le multe» in generale)","il comportamento voluto, per esempio: tenere chiuse le finestre; non fermarsi a lavarsi; non fischiettare e restare concentrati; non sprecare gas","l’idea che ci sta dietro, per esempio: il tempo di lavoro appartiene alla filanda, anche quello che serve per lavarsi; il corpo dell’operaio deve stare al servizio della macchina (niente fischi, niente pause, sopportare il caldo); ogni minuto e ogni spreco sono un costo per il proprietario","un’osservazione che fa la differenza: sono multati sia chi è sporco sia chi si lava. Comunque si comporti, l’operaio sbaglia, e lavarsi costa tempo di lavoro"]},{"id":"p1_q4","prompt":"Una riga. Che cosa ci dice questo elenco della giornata di lavoro di un filatore, e che cosa invece non ci dice?","righe":3,"intro":"Una buona risposta indica almeno una cosa per parte:","punti":["che cosa dice: si lavora al caldo, con le finestre chiuse; si comincia o si finisce al buio, con il gas acceso; si è sorvegliati e multati anche per gesti minimi","che cosa non dice: quanto si guadagna, quante ore si lavora, quanto spesso le multe venivano davvero applicate, perché il proprietario le aveva stabilite","chi ha guardato la fonte da vicino può aggiungere: non sappiamo se l’elenco è completo, perché lo hanno scelto gli scioperanti"]}],"approfondimento":{"titolo":"Che cosa c’è intorno all’elenco","testo":["Il lavoro in fabbrica è una cosa nuova, e la novità più dura non è la macchina: è il tempo. Nella bottega e nei campi il ritmo lo davano la stagione, la luce, il compito da finire. In fabbrica lo dà l’orologio, uguale per tutti: si entra e si esce a un’ora fissa, e ogni minuto perso è denaro perso per il proprietario. Per imporre questo ritmo le fabbriche si danno regolamenti fatti di regole e multe. Sono testi asciutti, che sembrano dire soltanto fatti; ma dietro ogni regola c’è un’idea: dentro la fabbrica, il tempo del lavoratore appartiene alla fabbrica.","Non tutte le regole erano solo disciplina. Il cotone si fila meglio in un’aria calda e umida, e le finestre chiuse servivano anche a questo. Ma quel caldo, per tutta la giornata, lo sopportavano gli operai, e chi apriva la finestra lo pagava di tasca propria."]}},{"chiave":"p2","titolo":"Parte 2 — Capital and Labour","meta":"Guida media · 12 minuti","contesto":["La vignetta esce il 12 agosto 1843 su Punch, un settimanale satirico di Londra. Il titolo inglese vuol dire «Capitale e lavoro». Un anno prima una commissione del Parlamento aveva pubblicato un rapporto sul lavoro dei bambini nelle miniere di carbone.","Guarda la vignetta con calma, ingrandendola se serve, prima di rispondere."],"fonte":{"tipo":"img","file":"punch","alt":"Incisione in bianco e nero divisa in tre riquadri. In alto, per tutta la larghezza, due interni di lusso: a sinistra un uomo ben vestito sprofondato in una poltrona, servito da un domestico in livrea; a destra una signora sdraiata su un divano tra cuscini e cagnolini, servita da un paggio. In basso a sinistra, dietro una porta chiusa, una figura femminile con un’àncora. In basso a destra, il riquadro più grande: una galleria di miniera, con una fune e un gancio che scendono dall’alto. Vi si affollano bambini, donne e uomini magri e stanchi: una donna allatta, un uomo curvo si appoggia a un bastone, alcuni bambini stanno dentro una cesta. A sinistra, seduto, un uomo grasso che non lavora.","didascalia":"R. J. Hammerton (firma «Shallaballa»), Capital and Labour (Capitale e lavoro), «Punch», 12 agosto 1843."},"mc":[{"id":"p2_q1","prompt":"Il disegno esce su un settimanale satirico. Che cosa puoi aspettarti da una fonte di questo tipo?","opts":["Una veduta esatta di una miniera, disegnata dal vero per informare i lettori inglesi","Un’illustrazione neutra del rapporto del Parlamento, senza commenti dell’autore","Una pubblicità delle miniere inglesi, pensata per attirare nuovi capitali dalla City","Un giudizio sulla società, espresso esagerando e mettendo a confronto le cose"],"ok":3,"why":"Una vignetta satirica non registra la realtà: la commenta. Esagera, semplifica, mette in ridicolo, perché vuole convincere il lettore di qualcosa. Non per questo è inutile allo storico: dice poco su come era fatta una miniera, e molto su come una parte del pubblico inglese giudicava il rapporto tra ricchi e lavoratori."}],"aperte":[{"id":"p2_q2","prompt":"Che cosa è messo in alto e che cosa in basso? Che effetto fa questa scelta?","righe":4,"intro":"Una buona risposta prima descrive e poi interpreta:","punti":["in alto: interni di lusso, un uomo in poltrona e una signora sdraiata, serviti da domestici, che non fanno nulla","in basso: una miniera sottoterra, con bambini, donne e uomini stanchi, magri, ammassati","l’effetto: la ricchezza sta letteralmente sopra il lavoro, e poggia su di esso. Chi sta in alto non vede chi sta in basso","in più: il contrasto è costruito, non trovato. L’autore ha messo nella stessa pagina due mondi che nella realtà non si incontravano"]},{"id":"p2_q3","prompt":"Contro chi è diretta la vignetta, e qual è la sua tesi? Indica un elemento del disegno che te lo fa dire.","righe":4,"intro":"Una buona risposta contiene almeno i primi tre punti:","punti":["il bersaglio: i ricchi proprietari, il «capitale» del titolo, che vivono nel lusso senza lavorare","la tesi: il benessere di pochi si regge sulla miseria e sulla fatica di molti, anche di donne e bambini","un elemento preciso del disegno, per esempio: la divisione in alto e in basso; il titolo «Capitale e lavoro»; i bambini nella cesta; la figura con l’àncora chiusa fuori dalla porta","va bene anche, se argomentato: il bersaglio è anche il pubblico, o il Parlamento, che tollera questa situazione"]}],"approfondimento":{"titolo":"Che cosa c’è intorno alla vignetta","testo":["Nell’Ottocento, con la diffusione della stampa illustrata, le vignette diventano un’arma per prendere posizione sulla questione sociale. Punch, nato a Londra nel 1841, ospitava grandi vignette sui temi del giorno. Questa non è una fotografia della società: è una tesi sulla società, messa in figura.","La vignetta risponde in parte al rapporto del 1842 sui bambini nelle miniere, che descriveva bambini e donne costretti a trascinare carrelli a carponi nelle gallerie. Dopo quel rapporto il Parlamento aveva già vietato il lavoro sottoterra alle donne e ai ragazzi sotto i dieci anni.","La figura chiusa fuori dalla porta, a sinistra, è la Speranza: l’àncora è il suo simbolo tradizionale.","Un’ultima cosa: chi l’ha disegnata? In basso a destra c’è la firma «Shallaballa», lo pseudonimo di R. J. Hammerton. Diversi libri la attribuiscono invece a John Leech, il disegnatore più famoso di Punch. Anche l’autore di una fonte va controllato, e a volte la prova è nella fonte stessa."]}}],"p3":{"titolo":"Parte 3 — Collegare le fonti alla slide","meta":"Guida media · 10 minuti","istruzioni":"Questa è la slide della lezione sul conflitto sociale. Come l’altra volta: uno schema mette in ordine molte cose in poche parole, una fonte ne mostra una sola, da vicino. Dì quale.","didascalia":"Slide della lezione: «Il conflitto sociale».","alt":"Slide della lezione, intitolata «Il conflitto sociale». Schema a frecce descritto per esteso nel testo che segue.","trascrizioneTitolo":"Lo schema della slide, a parole","trascrizione":"Sotto il titolo una fascia: «Aumento della ricchezza, ma sua distribuzione ineguale». A sinistra «PROLETARIATO», con una freccia verso «salario»; a destra «BORGHESIA industriale», con una freccia verso «profitto». Al centro «scontro tra», con frecce verso i due riquadri, e sotto «conflitto sociale». Da qui una freccia va a «Luddismo» e una scende a «scioperi e manifestazioni», poi a «repressione / conquiste». Dal proletariato scende una linea a «nascita dei sindacati» e poi a «nascita dei partiti socialisti», che portano entrambi a «conquiste»; dalla borghesia una freccia porta a «repressione». In fondo, «prime riforme sociali».","nodi":["Aumento della ricchezza, ma sua distribuzione ineguale","Proletariato","Borghesia industriale","Salario","Profitto","Conflitto sociale","Luddismo","Scioperi e manifestazioni","Nascita dei sindacati","Nascita dei partiti socialisti","Repressione","Conquiste","Prime riforme sociali"],"collegamenti":[{"fonteNome":"Multe di Tyldesley","nodo":{"id":"p3_n1","prompt":"Quale elemento della slide è documentato dall’elenco delle multe di Tyldesley?","ok":[7,5],"why":"Reggono due risposte. «Scioperi e manifestazioni»: l’elenco ci arriva perché fu stampato durante uno sciopero; il conflitto si vede nel modo in cui la fonte è arrivata fino a noi. «Conflitto sociale»: da una parte chi stabilisce e incassa le multe, dall’altra chi le paga e le denuncia. «Salario» è vicino ma non basta: la multa si toglie dalla paga, ma il documento parla di disciplina, non di quanto si guadagna. «Repressione» nella slide è la risposta agli scioperi; qui le multe vengono prima, servono a governare il lavoro di ogni giorno."},"motivazione":{"id":"p3_m1","prompt":"Motiva in una riga: che cosa, nella fonte o nel modo in cui ci è arrivata, te lo fa dire?","righe":2,"intro":"Una buona motivazione indica un elemento preciso:","punti":["per «Scioperi e manifestazioni»: l’opuscolo è stampato a Manchester durante lo sciopero dei filatori del 1823","per «Conflitto sociale»: il proprietario fissa le multe, gli operai le subiscono e poi le rendono pubbliche per denunciarle","non basta «parla degli operai»: serve un elemento della fonte"]}},{"fonteNome":"Vignetta di Punch","nodo":{"id":"p3_n2","prompt":"Quale elemento della slide è documentato dalla vignetta di Punch?","ok":[0],"why":"Regge «Aumento della ricchezza, ma sua distribuzione ineguale»: in alto la ricchezza, in basso chi la produce senza goderne. «Proletariato» e «Borghesia industriale» compaiono, ma da soli non bastano: la vignetta parla del rapporto tra i due, non dell’uno o dell’altro. Quanto a «Conflitto sociale» e «Scioperi», guarda bene: nel disegno i lavoratori non lottano, subiscono. La vignetta documenta la disuguaglianza, non il conflitto. E i ricchi in poltrona sono «borghesia industriale»? Il disegno non lo dice: potrebbero essere proprietari di miniere, nobili, rentiers."},"motivazione":{"id":"p3_m2","prompt":"Motiva in una riga: quale elemento del disegno te lo fa dire?","righe":2,"intro":"Una buona motivazione indica che cosa si vede:","punti":["la divisione in due piani: lusso e ozio in alto, fatica e miseria in basso","oppure il titolo «Capitale e lavoro», che mette i due mondi uno accanto all’altro","non basta «mostra i poveri»: la disuguaglianza è nel confronto, non in una sola delle due metà"]}}],"finali":[{"id":"p3_q3","prompt":"Quale parte dello schema non è documentata da nessuna delle due fonti? Che tipo di fonte ti servirebbe per documentarla?","righe":4,"intro":"Una buona risposta contiene almeno i primi tre punti:","punti":["una parte precisa dello schema, per esempio: «Luddismo», «nascita dei sindacati», «nascita dei partiti socialisti», «repressione», «prime riforme sociali», «profitto»","il perché: l’elenco mostra la disciplina dentro una filanda e, per come ci è arrivato, uno sciopero; la vignetta mostra la disuguaglianza. Nessuna delle due mostra organizzazioni operaie, governi o leggi","un tipo di fonte adatto. Per il luddismo: il resoconto di un attacco alle macchine, o una lettera firmata «Generale Ludd». Per i sindacati: lo statuto di un’associazione operaia. Per i partiti: un programma. Per la repressione: una sentenza, una cronaca degli scontri. Per le riforme: il testo di una legge"]},{"id":"p3_q4","prompt":"Ora il contrario: che cosa mostrano le due fonti che lo schema non ha?","righe":3,"intro":"Una buona risposta indica almeno una cosa precisa, per esempio:","punti":["la disciplina del tempo e del corpo dentro la fabbrica: lo schema parla del conflitto, non della vita di ogni giorno che lo produce","i bambini e le donne: lo schema dice «proletariato», le fonti mostrano chi ne fa parte","la miniera: la vignetta parla di minatori, non di operai di fabbrica","lavoratori che subiscono senza lottare: nello schema il proletariato agisce (scioperi, sindacati, partiti), nella vignetta è immobile e senza speranza"]},{"id":"p3_q5","facoltativa":true,"prompt":"Facoltativo. Se hai con te gli appunti della lezione, aggiungi una cosa che lì hai scritto e che né la slide né le fonti dicono.","righe":2,"intro":"Qui non c’è una risposta modello.","punti":["vale qualunque aggiunta precisa: un nome, una data, un esempio, un nesso","se non avevi gli appunti, questa parte non conta"]}]},"chiusura":"Tieni a mente queste risposte: la prossima lezione riparte da qui.","tempoAtteso":1500,"caratteriAttesi":800,"minChar":20,"maxChar":1500};

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function add(parent) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]); return parent; }
  function clear() { while (app.firstChild) app.removeChild(app.firstChild); }
  var uid = 0;
  function nid(p) { uid++; return p + "_" + uid; }

  function testata() { var h = el("div"); add(h, el("span", "tag", D.tipologiaEtichetta), el("h1", null, D.titolo)); return h; }
  function fonteBlocco(text, cls) { return el("blockquote", "src" + (cls ? " " + cls : ""), text); }

  function figura(src, alt, didascalia, cls) {
    var f = el("figure");
    var z = el("div", "zoom" + (cls ? " " + cls : ""));
    var im = el("img"); im.src = src; im.alt = alt; z.appendChild(im);
    var bar = el("div", "figbar");
    var cap = el("figcaption", "dida", didascalia);
    var b = el("button", "btn sec small", "Ingrandisci"); b.type = "button"; b.setAttribute("aria-pressed", "false");
    b.onclick = function () {
      var on = !z.classList.contains("on");
      z.classList.toggle("on", on);
      b.textContent = on ? "Riduci" : "Ingrandisci";
      b.setAttribute("aria-pressed", on ? "true" : "false");
      if (on) { z.tabIndex = 0; z.setAttribute("role", "group"); z.setAttribute("aria-label", "Immagine ingrandita: scorri per esplorarla"); z.scrollLeft = (z.scrollWidth - z.clientWidth) / 2; }
      else { z.removeAttribute("tabindex"); z.scrollLeft = 0; }
    };
    add(bar, b, cap); add(f, z, bar);
    return f;
  }
  function fonteDi(P) {
    var F = P.fonte, w = el("div");
    if (F.tipo === "testo") {
      var bq = el("blockquote", "src");
      bq.appendChild(el("div", null, F.intro));
      var ul = el("ul"); F.voci.forEach(function (v) { ul.appendChild(el("li", null, v)); }); bq.appendChild(ul);
      w.appendChild(bq);
      F.note.forEach(function (n) { w.appendChild(el("p", "srcnote", n)); });
      w.appendChild(el("p", "dida", F.didascalia));
    } else {
      w.appendChild(figura(IMG[F.file], F.alt, F.didascalia, "bw"));
    }
    return w;
  }
  function slide() {
    var w = el("div");
    w.appendChild(figura(IMG.slide, D.p3.alt, D.p3.didascalia, "slide"));
    var d = el("details"); add(d, el("summary", null, D.p3.trascrizioneTitolo), el("p", null, D.p3.trascrizione));
    w.appendChild(d);
    return w;
  }

  function scelta(q, opts) {
    var w = el("div", "q");
    var hid = nid("h");
    var h = el("h3", null, q.etichetta); h.id = hid; w.appendChild(h);
    var g = el("div"); g.setAttribute("role", "group"); g.setAttribute("aria-labelledby", hid);
    var btns = [];
    opts.forEach(function (t, i) {
      var b = el("button", "opt", t); b.type = "button";
      b.setAttribute("aria-pressed", S.mc[q.id] === i ? "true" : "false");
      b.onclick = function () { S.mc[q.id] = i; persist(); btns.forEach(function (x, j) { x.setAttribute("aria-pressed", j === i ? "true" : "false"); }); };
      btns.push(b); g.appendChild(b);
    });
    w.appendChild(g); w._focus = btns[0];
    return w;
  }
  function aperta(q, corta) {
    var w = el("div", "q");
    var tid = nid("t");
    var lab = el("label"); lab.htmlFor = tid; lab.appendChild(el("h3", null, q.etichetta || q.prompt));
    var ta = el("textarea", corta ? "short" : null); ta.id = tid; ta.maxLength = MAXC; ta.value = S.tx[q.id] || "";
    var cnt = el("div", "cnt"); cnt.id = tid + "_c"; ta.setAttribute("aria-describedby", cnt.id);
    function upd() { var n = ta.value.trim().length; cnt.textContent = ta.value.length + " / " + MAXC + (!q.facoltativa && n < MINC ? " · almeno " + MINC + " caratteri" : ""); }
    ta.oninput = function () { S.tx[q.id] = ta.value; persist(); upd(); };
    upd(); add(w, lab, ta, cnt); w._focus = ta;
    return w;
  }
  function menuNodi(q) {
    var w = el("div", "q");
    var sid = nid("s");
    var lab = el("label"); lab.htmlFor = sid; lab.appendChild(el("h3", null, q.etichetta));
    var sel = el("select"); sel.id = sid;
    var o0 = el("option", null, "Scegli un elemento della slide…"); o0.value = ""; sel.appendChild(o0);
    D.p3.nodi.forEach(function (t, i) { var o = el("option", null, t); o.value = String(i); sel.appendChild(o); });
    sel.value = S.mc[q.id] == null ? "" : String(S.mc[q.id]);
    sel.onchange = function () { if (sel.value === "") delete S.mc[q.id]; else S.mc[q.id] = Number(sel.value); persist(); };
    add(w, lab, sel); w._focus = sel;
    return w;
  }
  function okTesto(id) { return (S.tx[id] || "").trim().length >= MINC; }

  function passo(n) {
    if (n >= 1 && n <= NP) { var P = D.parti[n - 1]; return { nome: P.titolo, meta: P.meta }; }
    if (n === NP + 1) return { nome: D.p3.titolo, meta: D.p3.meta };
    return { nome: D.p3.titolo, meta: "Ultime domande", bloccato: "Da qui non si torna indietro: le scelte fatte sulla slide sono definitive." };
  }

  function render() {
    uid = 0; clear();
    app.appendChild(testata());
    if (S.sub) { renderCorrezione(); return; }
    if (S.step === 0) { renderAvvio(); return; }
    var Pp = passo(S.step);
    var c = el("div", "card");
    c.appendChild(el("div", "sub", "Passo " + S.step + " di " + ULTIMO));
    var bar = el("div", "bar"); var fill = el("i"); fill.style.width = Math.round((S.step - 1) / ULTIMO * 100) + "%"; bar.appendChild(fill); c.appendChild(bar);
    var h2 = el("h2", null, Pp.nome); h2.tabIndex = -1; c.appendChild(h2);
    c.appendChild(el("div", "sub", Pp.meta));
    var campi = [];
    function campo(node, manca) { c.appendChild(node); campi.push({ node: node, manca: manca }); return node; }

    if (S.step <= NP) {
      var P = D.parti[S.step - 1];
      P.contesto.forEach(function (t) { c.appendChild(el("p", null, t)); });
      c.appendChild(fonteDi(P));
      var n = 1;
      P.mc.forEach(function (q) { campo(scelta({ id: q.id, etichetta: (n++) + ". " + q.prompt }, q.opts), function () { return S.mc[q.id] == null; }); });
      P.aperte.forEach(function (q) { campo(aperta({ id: q.id, etichetta: (n++) + ". " + q.prompt }, q.righe <= 3), function () { return !okTesto(q.id); }); });
    } else if (S.step === NP + 1) {
      add(c, el("p", null, D.p3.istruzioni), slide());
      D.p3.collegamenti.forEach(function (cg, i) {
        campo(menuNodi({ id: cg.nodo.id, etichetta: (i + 1) + ". " + cg.nodo.prompt }), function () { return S.mc[cg.nodo.id] == null; });
        var m = campo(aperta({ id: cg.motivazione.id, etichetta: cg.motivazione.prompt }, true), function () { return !okTesto(cg.motivazione.id); });
        m.className = "q first";
      });
    } else {
      c.appendChild(slide());
      c.appendChild(el("p", null, "Le tue scelte:"));
      var ul = el("ul", "recap");
      D.p3.collegamenti.forEach(function (cg) {
        var li = el("li");
        add(li, el("span", "lbl", cg.fonteNome + " → "), document.createTextNode(S.mc[cg.nodo.id] == null ? "(nessuna scelta)" : D.p3.nodi[S.mc[cg.nodo.id]]));
        ul.appendChild(li);
      });
      c.appendChild(ul);
      var k = D.p3.collegamenti.length + 1;
      D.p3.finali.forEach(function (q, i) {
        var f = campo(aperta({ id: q.id, etichetta: (k + i) + ". " + q.prompt, facoltativa: q.facoltativa }, q.righe <= 3), function () { return !q.facoltativa && !okTesto(q.id); });
        if (i === 0) f.className = "q first";
      });
    }
    if (Pp.bloccato) c.appendChild(el("div", "note", Pp.bloccato));
    if (S.step === ULTIMO) c.appendChild(el("div", "note", "Quando consegni, le risposte non si possono più modificare e compare la correzione."));
    var err = el("div", "err"); err.setAttribute("role", "alert"); c.appendChild(err);
    var back = el("button", "btn sec", "Indietro"); back.type = "button"; back.disabled = !!Pp.bloccato;
    var next = el("button", "btn", S.step === ULTIMO ? "Consegna" : "Avanti"); next.type = "button";
    var row = el("div", "row"); add(row, back, next); c.appendChild(row);
    back.onclick = function () { if (!Pp.bloccato && S.step > 0) { S.step--; persist(); render(); } };
    next.onclick = function () {
      var mancanti = campi.filter(function (f) { return f.manca(); });
      if (mancanti.length) {
        err.textContent = (mancanti.length === 1 ? "Manca ancora una risposta." : "Mancano ancora " + mancanti.length + " risposte.") + " Le risposte scritte devono avere almeno " + MINC + " caratteri.";
        var f = mancanti[0].node._focus; if (f) f.focus();
        return;
      }
      if (S.step < ULTIMO) { S.step++; persist(); render(); } else consegna(next, err);
    };
    function pulisci(ev) { if (ev.target !== next && err.textContent) err.textContent = ""; }
    c.addEventListener("input", pulisci); c.addEventListener("change", pulisci); c.addEventListener("click", pulisci);
    app.appendChild(c);
    window.scrollTo(0, 0);
    try { h2.focus({ preventScroll: true }); } catch (e) { h2.focus(); }
  }

  function renderAvvio() {
    var c = el("div", "card");
    var h2 = el("h2", null, D.richiamo.titolo); h2.tabIndex = -1; c.appendChild(h2);
    D.richiamo.testo.forEach(function (t) { c.appendChild(el("p", null, t)); });
    var b = el("button", "btn", "Comincia"); b.type = "button";
    b.onclick = function () { S.step = 1; persist(); render(); };
    var row = el("div", "row"); add(row, el("span"), b); c.appendChild(row);
    app.appendChild(c);
    window.scrollTo(0, 0);
  }

  function buildAnswers() {
    var list = [], right = 0, tot = 0;
    function chiusa(id, prompt, opts, okFn) {
      tot++;
      var k = S.mc[id]; if (k == null) return;
      var good = okFn(k); if (good) right++;
      list.push({ id: id, prompt: prompt, type: "mc", answer: opts[k], correct: good });
    }
    function testo(id, prompt) {
      var t = (S.tx[id] || "").trim(); if (!t) return;
      list.push({ id: id, prompt: prompt, type: "essay", answer: t.slice(0, 4000), correct: null });
    }
    D.parti.forEach(function (P) {
      P.mc.forEach(function (q) { chiusa(q.id, q.prompt, q.opts, function (k) { return k === q.ok; }); });
      P.aperte.forEach(function (q) { testo(q.id, q.prompt); });
    });
    D.p3.collegamenti.forEach(function (cg) {
      chiusa(cg.nodo.id, cg.nodo.prompt, D.p3.nodi, function (k) { return cg.nodo.ok.indexOf(k) !== -1; });
      testo(cg.motivazione.id, cg.motivazione.prompt);
    });
    D.p3.finali.forEach(function (q) { testo(q.id, q.prompt); });
    return { list: list, right: right, tot: tot, score: Math.round(right / tot * 100) };
  }

  var sending = false, tentativi = 0;
  function consegna(btn, err) {
    if (sending) return; sending = true; btn.disabled = true; err.textContent = "Consegna in corso…";
    var r = buildAnswers(), invio;
    try { invio = window.Addestramento ? Promise.resolve(window.Addestramento.completa(r.list, r.score)).catch(function () { return false; }) : Promise.resolve(false); }
    catch (e) { invio = Promise.resolve(false); }
    invio.then(function (ok) {
      if (ok === false && window.Addestramento && ++tentativi < 2) {
        sending = false; btn.disabled = false; btn.textContent = "Consegna (riprova)";
        err.textContent = "Invio non riuscito: controlla la connessione e riprova.";
        return;
      }
      S.sub = true; S.ok = (ok !== false); persist(); sending = false; render();
    });
  }

  function esito(good, tua) { var m = el("div", "res " + (good ? "ok" : "ko")); add(m, el("span", "lbl", good ? "Corretto — " : "Non corretto — "), document.createTextNode("la tua risposta: " + tua)); return m; }
  function giusta(text) { var g = el("div", "res ok"); add(g, el("span", "lbl", "Risposta giusta: "), document.createTextNode(text)); return g; }
  function cardChiusa(titolo, k, opts, okFn, giustaTxt, why) {
    var d = el("div", "card");
    d.appendChild(el("h3", null, titolo));
    var good = k != null && okFn(k);
    d.appendChild(esito(good, k == null ? "(nessuna)" : opts[k]));
    if (!good) d.appendChild(giusta(giustaTxt));
    d.appendChild(el("p", null, why));
    return d;
  }
  function cardAperta(titolo, q) {
    var d = el("div", "card");
    d.appendChild(el("h3", null, titolo));
    d.appendChild(el("div", "lbl", "La tua risposta"));
    d.appendChild(el("div", "mine", (S.tx[q.id] || "").trim() || "(nessuna)"));
    var m = el("div", "model");
    m.appendChild(el("div", "lbl", q.facoltativa ? "Nota" : "Modello di risposta"));
    m.appendChild(el("div", null, q.intro));
    var ul = el("ul"); q.punti.forEach(function (t) { ul.appendChild(el("li", null, t)); }); m.appendChild(ul);
    d.appendChild(m);
    if (!q.facoltativa) d.appendChild(el("p", "note", "Confronta: che cosa avevi già scritto? Che cosa ti è sfuggito?"));
    return d;
  }
  function cardApprofondimento(a) { var d = el("div", "card"); d.appendChild(el("h3", null, a.titolo)); a.testo.forEach(function (t) { d.appendChild(el("p", null, t)); }); return d; }
  function parte(titolo) { var p = el("div", "part"); p.appendChild(el("h2", null, titolo)); return p; }

  function renderCorrezione() {
    var r = buildAnswers();
    var c = el("div", "card");
    var h2 = el("h2", null, "Esercitazione consegnata"); h2.tabIndex = -1; c.appendChild(h2);
    c.appendChild(el("div", "score", r.right + " su " + r.tot + " risposte chiuse corrette"));
    c.appendChild(el("p", null, "Qui sotto trovi la correzione. Leggila con calma: serve a capire che cosa ti manca, non a prendere un voto. Per le risposte scritte non c'è un esito automatico: confrontale tu con il modello."));
    c.appendChild(el("p", S.ok === false ? "note warn" : "note", S.ok === false ? "Attenzione: il risultato NON è stato registrato (connessione assente o bloccata). Avvisa il docente." : "Risultato registrato."));
    app.appendChild(c);
    D.parti.forEach(function (P) {
      app.appendChild(parte(P.titolo));
      var fc = el("div", "card"); fc.appendChild(fonteDi(P)); app.appendChild(fc);
      var n = 1;
      P.mc.forEach(function (q) { app.appendChild(cardChiusa((n++) + ". " + q.prompt, S.mc[q.id], q.opts, function (k) { return k === q.ok; }, q.opts[q.ok], q.why)); });
      P.aperte.forEach(function (q) { app.appendChild(cardAperta((n++) + ". " + q.prompt, q)); });
      app.appendChild(cardApprofondimento(P.approfondimento));
    });
    app.appendChild(parte(D.p3.titolo));
    var sl = el("div", "card"); sl.appendChild(slide()); app.appendChild(sl);
    D.p3.collegamenti.forEach(function (cg, i) {
      var okTxt = cg.nodo.ok.map(function (j) { return "«" + D.p3.nodi[j] + "»"; }).join(" oppure ");
      app.appendChild(cardChiusa((i + 1) + ". " + cg.nodo.prompt, S.mc[cg.nodo.id], D.p3.nodi, function (k) { return cg.nodo.ok.indexOf(k) !== -1; }, okTxt, cg.nodo.why));
      app.appendChild(cardAperta(cg.motivazione.prompt, cg.motivazione));
    });
    var k = D.p3.collegamenti.length + 1;
    D.p3.finali.forEach(function (q, i) { app.appendChild(cardAperta((k + i) + ". " + q.prompt, q)); });
    var fine = el("div", "card"); fine.appendChild(el("p", null, D.chiusura));
    if (S.ok === false) fine.appendChild(el("p", "note warn", "Ricorda: il risultato NON è stato registrato. Avvisa il docente."));
    app.appendChild(fine);
    window.scrollTo(0, 0);
    try { h2.focus({ preventScroll: true }); } catch (e) { h2.focus(); }
  }

  function avvia() {
    app = document.getElementById("app");
    if (!window.Addestramento) { render(); return; }
    try {
      window.Addestramento.start({
        labId: LAB_ID,
        title: D.titolo,
        salvaRisposte: true,                 // decisione esplicita: il docente legge le risposte finali
        tempoAtteso: D.tempoAtteso,          // secondi per uno studente concentrato
        caratteriAttesi: D.caratteriAttesi,  // caratteri complessivi nelle risposte aperte
        onReady: function () { app = document.getElementById("app"); render(); }
      });
    } catch (e) { render(); }
  }
  avvia();
})();
</script>
</body>
</html>
